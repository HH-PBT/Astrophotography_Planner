<style>
/* ============================================================
   Night Plan — one stylesheet, in layers:
   tokens · base · chrome · surfaces · controls · components

   The look comes from the subject: a dark sky, an amber ephemeris,
   a cyan horizon line. Amber is the only colour that means "act" or
   "now"; cyan means "measured"; everything else stays quiet, so a
   screen read at 2am has exactly one thing shouting.
   ============================================================ */

/* ---------- tokens ---------- */
:root{
  --bg:#080a10; --panel:#101521; --panel2:#151c2b; --line:#232c3f; --line2:#2e3950;
  --ink:#e8e2d6; --ink2:#9aa4b8; --ink3:#78829a;
  --amber:#e9a13b; --teal:#7fd1de; --violet:#b39ae0; --red:#d4595c; --green:#79c08a;

  /* a 4px rhythm, used everywhere so cards line up down the page */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --r-sm:7px; --r:11px; --r-lg:16px;
  --pad:14px;
  --tap:44px;                       /* smallest thing a cold thumb should have to hit */
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --ease:cubic-bezier(.2,.7,.3,1);
  color-scheme:dark;
}
body.red{
  --bg:#0a0405; --panel:#180809; --panel2:#200b0c; --line:#3a1315; --line2:#4a1a1c;
  --ink:#ffb3a0; --ink2:#c47a68; --ink3:#9a5f50;
  --amber:#ff8a5c; --teal:#e08a70; --violet:#e09a80; --red:#ff6b5c; --green:#d69a72;
  --shadow:0 10px 30px rgba(0,0,0,.6);
}

/* ---------- base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
  -webkit-font-smoothing:antialiased;
}
/* red light mode has to reach the pictures too, or the whole point is lost */
body.red img,body.red canvas{filter:sepia(1) hue-rotate(-35deg) saturate(5) brightness(.75)}

h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.012em}
h1{font-size:20px;line-height:1.25}
h2{font-size:17px;line-height:1.3}
h3{font-size:13.5px;line-height:1.35;color:var(--ink2);font-weight:600;letter-spacing:0}
a{color:var(--teal);text-underline-offset:2px}
button,select,input,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
::selection{background:color-mix(in srgb,var(--amber) 35%,transparent)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- chrome: progress, header, nav ---------- */
#prog{position:fixed;left:0;right:0;top:0;height:2px;z-index:60;opacity:0;
  transition:opacity .18s;pointer-events:none;overflow:hidden}
#prog i{display:block;height:100%;width:40%;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--amber),transparent);
  animation:progslide 1.1s linear infinite}
body.working #prog{opacity:1}
@keyframes progslide{from{transform:translateX(-100%)}to{transform:translateX(350%)}}

header{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 93%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:calc(var(--s2) + env(safe-area-inset-top)) var(--s3) var(--s2);
}
.hrow{display:flex;align-items:center;gap:var(--s2)}
.hrow .title{font-size:15.5px;font-weight:600;flex:1;min-width:0;letter-spacing:-.012em}
.hrow .sub{font-size:12px;color:var(--ink3);font-weight:400;letter-spacing:0}
.datenav{display:flex;align-items:center;gap:var(--s1)}
.datenav button{background:var(--panel);border:1px solid var(--line);color:var(--ink2);
  width:32px;height:32px;border-radius:var(--r-sm);line-height:1;transition:background .12s}
.datenav button:active{background:var(--panel2);transform:scale(.94)}
.verdict{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid;white-space:nowrap}
.v-go{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent);background:color-mix(in srgb,var(--green) 12%,transparent)}
.v-marginal{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.v-no{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 12%,transparent)}

main{padding:var(--s3);max-width:760px;margin:0 auto;touch-action:pan-y}
@keyframes slideL{from{opacity:.4;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.4;transform:translateX(-12px)}to{opacity:1;transform:none}}
main.slide-l{animation:slideL .18s var(--ease)}
main.slide-r{animation:slideR .18s var(--ease)}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;background:none;border:0;padding:7px 2px 6px;color:var(--ink3);min-height:54px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;
  letter-spacing:.01em;transition:color .12s;
}
nav.tabs button .ic{font-size:16px;line-height:1.1}
nav.tabs button[aria-current="true"]{color:var(--amber)}
nav.tabs button:active{color:var(--ink)}
@media (min-width:520px){nav.tabs button{font-size:11px;padding:8px 2px}}

/* ---------- surfaces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--pad);margin-bottom:var(--s3)}
.card.tight{padding:10px var(--s3)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2) var(--s3)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}

.stat{font-size:12px;color:var(--ink3);line-height:1.3}
.stat b{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-bottom:1px}
.muted{color:var(--ink2)}
.dim{color:var(--ink3);font-size:12.5px;line-height:1.45}
.ok{color:var(--green)} .warn{color:var(--amber)} .bad{color:var(--red)}

.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.t-emission{color:#f0a8a0;border-color:#5a2f2c}
.pill.t-reflection{color:#a8c4f0;border-color:#2c3d5a}
.pill.t-planetary{color:#9ee0c0;border-color:#2a4f42}
.pill.t-galaxy,.pill.t-galaxy_group{color:#e3c98a;border-color:#54462a}
.pill.t-globular{color:#d8b8e8;border-color:#46315a}
.pill.t-open,.pill.t-assoc{color:#8fd4dd;border-color:#2a4a52}
.pill.t-cluster_neb{color:#f0b8d8;border-color:#5a2f48}
.pill.t-snr{color:#e09b7a;border-color:#5a3a26}
.pill.t-dark{color:#9aa4b8;border-color:#2e3648}
body.red .pill{color:var(--ink2);border-color:var(--line)}

/* ---------- controls ---------- */
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
  padding:0 14px;min-height:var(--tap);border-radius:var(--r-sm);font-size:14px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:background .12s,border-color .12s,transform .06s}
.btn:active{transform:scale(.97);background:var(--line)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#140d02;font-weight:600}
.btn.primary:active{background:color-mix(in srgb,var(--amber) 85%,#000)}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink2)}
.btn.ghost:active{background:var(--panel2);color:var(--ink)}
.btn.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.sm{padding:0 11px;font-size:12.5px;min-height:36px}
.btn:disabled{opacity:.4;pointer-events:none}
.btnrow{display:flex;gap:var(--s2);flex-wrap:wrap}

label.f{display:block;font-size:12px;color:var(--ink2);margin-bottom:var(--s1)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r-sm);
  padding:0 10px;min-height:var(--tap);transition:border-color .12s}
textarea{padding:9px 10px;min-height:76px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:color-mix(in srgb,var(--teal) 55%,var(--line2));outline:none}
input[type=range]{width:100%;accent-color:var(--amber);height:34px}
input[type=checkbox]{width:20px;height:20px;flex:0 0 20px;accent-color:var(--amber)}
.field{margin-bottom:10px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;min-height:38px;padding:0 13px;border-radius:99px;background:var(--panel2);
  border:1px solid var(--line);color:var(--ink2);cursor:pointer;
  display:inline-flex;align-items:center;transition:background .12s,border-color .12s,color .12s,transform .06s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--amber) 16%,transparent);
  border-color:color-mix(in srgb,var(--amber) 70%,transparent);color:var(--amber)}
.chip:disabled{opacity:.4;pointer-events:none}

details summary{cursor:pointer;color:var(--ink2);font-size:13px;padding:var(--s1) 0;
  list-style:none;display:flex;align-items:center;gap:6px;min-height:34px}
details summary::-webkit-details-marker{display:none}
details>summary::before{content:'';width:0;height:0;flex:0 0 auto;
  border:4px solid transparent;border-left-color:var(--ink3);
  transition:transform .15s var(--ease)}
details[open]>summary::before{transform:rotate(90deg)}
details[open]>summary{color:var(--ink)}
details.card>summary{font-weight:600;font-size:14px;color:var(--ink);min-height:38px}

/* ---------- lists and rows ---------- */
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:center}
.list li:last-child{border-bottom:0}
.list .nm{flex:1;min-width:0}
.list .nm b{font-weight:600;display:block;font-size:14.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:block;font-size:12px;color:var(--ink2);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{font-size:12.5px;color:var(--amber);font-weight:600;white-space:nowrap;flex:0 0 auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv .k{color:var(--ink3)}

/* the catalogue: fixed row height, so a virtual window can do the maths exactly */
.tvirt{position:relative}
.tvirt .list{position:absolute;inset:0;display:block}
.trow{position:absolute;left:0;right:0;height:64px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);padding:0 2px;cursor:pointer}
.trow .nm{min-width:0;flex:1;display:block}
.trow .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.trow:active,.srow:active{background:var(--panel2)}

.srow{display:flex;align-items:center;gap:10px;padding:10px 2px;
  border-bottom:1px solid var(--line);cursor:pointer}
.srow:last-child{border-bottom:0}
.srow .nm{flex:1;min-width:0}
.srow .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.srow .dim.sm{font-size:11.5px;flex:0 0 auto}
.prime{flex:0 0 auto;font-size:11px;color:var(--amber);
  border:1px solid color-mix(in srgb,var(--amber) 60%,transparent);
  border-radius:99px;padding:3px 9px;background:color-mix(in srgb,var(--amber) 10%,transparent)}

.searchbar{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:var(--s2)}

/* ---------- the night, drawn ---------- */
.tl{position:relative;height:86px;margin:6px 0 2px;border-radius:var(--r-sm);overflow:hidden;
  background:var(--panel2);border:1px solid var(--line)}
canvas.altplot{width:100%;height:70px;display:block}
.wx{display:flex;gap:1px;height:40px;align-items:flex-end}
.wx div{flex:1;background:var(--panel2);border-radius:2px 2px 0 0;position:relative}
.wxlab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--ink3);margin-top:2px}
.wx{touch-action:pan-y;cursor:crosshair}
.wxticks{position:relative;height:13px;margin-top:3px}
.wxticks span{position:absolute;transform:translateX(-50%);font-size:9.5px;color:var(--ink3)}
.wxread{font-size:12px;color:var(--ink2);margin-top:5px;min-height:17px}
canvas.altplot{touch-action:pan-y;cursor:crosshair}

/* ---------- schedule ---------- */
.blockcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);
  border-radius:var(--r);padding:var(--s3);margin-bottom:var(--s3)}
.blockcard.locked{border-left-color:var(--teal)}
.blockcard h2{font-size:16px;margin-top:2px}
.timerange{font-size:13px;color:var(--amber);font-weight:600}
.why{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px var(--s2);align-items:center;
  font-size:11px;margin-top:var(--s2)}
.bars .bl{color:var(--ink3)} .bars .bv{color:var(--ink2);text-align:right}
.bars .track{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bars .fill{height:100%;background:var(--teal)}
.bars .fill.neg{background:var(--red)}

/* an unfilled stretch: dashed, because it is a hole rather than a thing */
.gapcard{border:1px dashed var(--line2);border-radius:var(--r);padding:var(--s3);
  margin-bottom:var(--s3);background:color-mix(in srgb,var(--panel) 55%,transparent)}
.gapcard .timerange{color:var(--ink2)}
.gapcard .sc{color:var(--ink2)}

/* ---------- framing previews ---------- */
.thumb{width:100%;aspect-ratio:16/9;border-radius:var(--r-sm);background:var(--panel2);
  object-fit:cover;display:block;border:1px solid var(--line)}
.fovbox{position:relative}
.fovbox .frame{position:absolute;border:1.5px dashed var(--teal);pointer-events:none;
  border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.fovbox .cap{position:absolute;bottom:5px;left:6px;font-size:10px;color:var(--teal);
  background:rgba(8,10,16,.66);padding:2px 6px;border-radius:5px;backdrop-filter:blur(3px)}
.fovbox.plain{background:none;border:0;text-align:left}
.fovbox.noimg{min-height:148px;border:1px dashed var(--line);border-radius:var(--r);
  background:#05070c;display:flex;align-items:center;justify-content:center}
.fovbox.noimg img,.fovbox.noimg .frame,.fovbox.noimg .cap{display:none}
.fovbox.noimg::after{content:'Survey view needs a connection';color:var(--ink3);font-size:12px}
.cmpwrap{position:relative;width:100%;margin-top:6px;border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;background:#05070c}
.cmpwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}

/* ---------- sheets ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(3,5,9,.72);z-index:60;
  display:flex;align-items:flex-end;transition:background .18s;animation:fade .16s var(--ease)}
.sheet{background:var(--panel);border-top-left-radius:var(--r-lg);border-top-right-radius:var(--r-lg);
  width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow);
  padding:10px var(--pad) calc(var(--s5) + env(safe-area-inset-bottom));
  border-top:1px solid var(--line2);max-width:760px;margin:0 auto;
  animation:sheetup .24s var(--ease)}
.sheet .handle{width:44px;height:5px;background:var(--line2);border-radius:99px;
  margin:2px auto 12px;cursor:grab}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetup{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}

/* ---------- toast, with room for one undo ---------- */
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:var(--s3);
  background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);
  padding:10px 12px;font-size:13px;max-width:min(92vw,520px);box-shadow:var(--shadow);
  animation:toastin .2s var(--ease)}
.toast span{min-width:0}
.toast button{background:none;border:0;color:var(--amber);font-weight:600;font-size:13px;
  padding:2px;cursor:pointer;flex:0 0 auto}
@keyframes toastin{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- waiting and emptiness ---------- */
.spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--amber);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--ink2);padding:var(--s5) var(--s3);font-size:13.5px;line-height:1.55}
.empty2{color:var(--ink3);font-size:12.5px;margin-top:6px}
.skel{border-radius:var(--r-sm);background:linear-gradient(90deg,var(--panel2) 25%,var(--line) 37%,var(--panel2) 63%);
  background-size:400% 100%;animation:shine 1.3s ease-in-out infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}

/* ---------- gallery ---------- */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.pgrid.sm{grid-template-columns:repeat(4,minmax(0,1fr))}
.ptile{position:relative;padding:0;border:1px solid var(--line);border-radius:var(--r-sm);
  overflow:hidden;background:var(--panel2);aspect-ratio:1;cursor:pointer;display:block;
  transition:transform .08s}
.ptile:active{transform:scale(.97)}
.ptile img{width:100%;height:100%;object-fit:cover;display:block}
.ptile .cov{position:absolute;left:4px;bottom:4px;font-size:9.5px;color:var(--amber);
  background:rgba(8,10,16,.75);padding:1px 5px;border-radius:4px}
.minithumb{width:44px;height:44px;flex:0 0 44px;border-radius:var(--r-sm);overflow:hidden;padding:0;
  border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;
  justify-content:center;color:var(--ink3);font-size:13px}
.minithumb img{width:100%;height:100%;object-fit:cover}
.fullshot{width:100%;border-radius:var(--r);border:1px solid var(--line);background:#05070c;
  display:block;max-height:62vh;object-fit:contain}

/* ---------- quick pick ---------- */
.qstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.qstrip::-webkit-scrollbar{display:none}
.qchip{flex:0 0 auto;min-height:38px;padding:0 13px;border-radius:99px;font-size:12.5px;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap;
  display:inline-flex;align-items:center;cursor:pointer}
.qchip.on{border-color:color-mix(in srgb,var(--amber) 70%,transparent);color:var(--amber);
  background:color-mix(in srgb,var(--amber) 14%,transparent)}

/* ---------- time on target ---------- */
.progwrap{margin-top:6px}
.progbar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));
  transition:width .3s var(--ease)}
.list.sess li{display:flex;align-items:center;gap:10px;justify-content:space-between}
.list.sess b{color:var(--ink)}

/* ---------- the year ahead ---------- */
.cu{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.cu:last-child{border-bottom:0}
.cum{flex:0 0 34px;color:var(--amber);font-weight:600;font-size:12.5px}
.cul{flex:1;min-width:0;font-size:13px;line-height:1.55}
.cul b{cursor:pointer}

/* ---------- the readout that follows you around Setup ---------- */
.livebar{
  position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:45;
  display:flex;gap:var(--s2);justify-content:center;align-items:center;flex-wrap:wrap;
  padding:7px var(--s3);background:color-mix(in srgb,var(--bg) 95%,transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);
}
.livebar b{color:var(--amber);font-weight:600}

/* ---------- motion, only when it is wanted ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
  .spin,#prog i{animation-duration:1.2s !important;animation-iteration-count:infinite !important}
}

</style>
</head>

  <button role="tab" data-v="gallery"><span class="ic" aria-hidden="true">◫</span>Images</button>
  <button role="tab" data-v="horizon"><span class="ic" aria-hidden="true">⛰</span>Horizon</button>

</nav>

/* ============================================================
   Astronomy engine.  All instants are UTC milliseconds.
   Angles in degrees unless suffixed _r.

const A = (() => {
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const sin = d => Math.sin(d * D2R), cos = d => Math.cos(d * D2R), tan = d => Math.tan(d * D2R);
  const norm = d => ((d % 360) + 360) % 360;

  const jd = ms => ms / 86400000 + 2440587.5;
  const msFromJd = j => (j - 2440587.5) * 86400000;

  /* ---- Sun: Meeus low precision, ~0.01 deg ---- */
  function sun(ms) {
    const n = jd(ms) - 2451545.0;
    const L = norm(280.460 + 0.9856474 * n);
    const g = norm(357.528 + 0.9856003 * n);
    const lam = norm(L + 1.915 * sin(g) + 0.020 * sin(2 * g));
    const eps = 23.439 - 0.0000004 * n;
    const ra = norm(Math.atan2(cos(eps) * sin(lam), cos(lam)) * R2D);
    const dec = Math.asin(sin(eps) * sin(lam)) * R2D;
    return { ra, dec, lam };

  /* ---- Moon: truncated ELP, ~0.2 deg.  Plenty for separation + phase ---- */

    const Lp = norm(218.3164477 + 481267.88123421 * T);
    const D = norm(297.8501921 + 445267.1114034 * T);

    const lam = Lp + 6.289 * sin(Mp) + 1.274 * sin(2 * D - Mp) + 0.658 * sin(2 * D)

      + 0.059 * sin(2 * D - 2 * Mp) + 0.057 * sin(2 * D - M - Mp)
      + 0.053 * sin(2 * D + Mp) + 0.046 * sin(2 * D - M)
      - 0.041 * sin(M - Mp) - 0.035 * sin(D) - 0.031 * sin(M + Mp);
    const bet = 5.128 * sin(F) + 0.281 * sin(Mp + F) - 0.278 * sin(F - Mp)
      - 0.173 * sin(2 * D - F) + 0.055 * sin(2 * D + F - Mp)

    timeZone: tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'

  const p = {}; for (const x of dtf.formatToParts(new Date(ms))) p[x.type] = x.value;
  const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
  return Math.round((asUTC - Math.floor(ms / 1000) * 1000) / 60000);

  return guess;
}

  return new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(ms));
}

  }
  if (c.y > 0 && window.scrollY !== c.y) window.scrollTo(0, c.y);
}


/* ---------------- in-place DOM update ----------------
   Settings used to be applied by throwing the whole screen away and building it
   again, which dropped you back at the top of the page and closed the keyboard.
   Instead we walk the old and new trees together and change only what differs,
   so the element under your finger — and the scroll position — survive. */
function sameNode(a, b) {
  if (a.nodeType !== b.nodeType) return false;
  if (a.nodeType !== 1) return true;
  if (a.tagName !== b.tagName) return false;
  if ((a.id || '') !== (b.id || '')) return false;
  const da = a.dataset || {}, db = b.dataset || {};
  return (da.act || '') === (db.act || '') && (da.k || '') === (db.k || '') &&
         (da.n || '') === (db.n || '') && (da.i || '') === (db.i || '');
}
function morphAttrs(el, nw) {
  const live = el === document.activeElement;
  for (const at of Array.from(nw.attributes)) {
    if (el.getAttribute(at.name) !== at.value) el.setAttribute(at.name, at.value);
  }
  for (const at of Array.from(el.attributes)) {
    if (nw.hasAttribute(at.name)) continue;
    /* an open disclosure stays open, and a file input keeps its picked file */
    if (at.name === 'open' && el.tagName === 'DETAILS') continue;
    if (at.name === 'data-bound') continue;      /* listeners already attached to this element */
    if (at.name === 'value' && el.tagName === 'INPUT' && el.type === 'file') continue;
    el.removeAttribute(at.name);
  }
  if (el.tagName === 'INPUT') {
    if (el.type === 'checkbox' || el.type === 'radio') { if (el.checked !== nw.checked) el.checked = nw.checked; }
    else if (el.type !== 'file' && !live) {
      const v = nw.getAttribute('value'); if (v != null && el.value !== v) el.value = v;
    }
  } else if (el.tagName === 'TEXTAREA') {
    if (!live) { const v = nw.textContent; if (el.value !== v) el.value = v; }
  } else if (el.tagName === 'SELECT' && !live) {
    const o = nw.querySelector('option[selected]');
    if (o && el.value !== o.value) el.value = o.value;
  }
}
function morph(el, nw) {
  morphAttrs(el, nw);
  if (el.tagName === 'CANVAS') return;
  if (el.tagName === 'SELECT') {
    if (el.children.length !== nw.children.length) el.innerHTML = nw.innerHTML;
    return;
  }
  morphChildren(el, nw);
}
function morphChildren(el, nw) {
  const kids = Array.from(nw.childNodes);
  for (let i = 0; i < kids.length; i++) {
    const bn = kids[i], an = el.childNodes[i];
    if (!an) { el.appendChild(bn); continue; }
    if (!sameNode(an, bn)) { el.replaceChild(bn, an); continue; }
    if (an.nodeType === 1) morph(an, bn);
    else if (an.nodeValue !== bn.nodeValue) an.nodeValue = bn.nodeValue;
  }
  while (el.childNodes.length > kids.length) el.removeChild(el.lastChild);
}
function paint(host, html) {
  const tmp = document.createElement(host.tagName);
  tmp.innerHTML = html;
  /* the host itself keeps its own id and classes — only its contents are reconciled */
  try { morphChildren(host, tmp); }
  catch (e) { console.warn('morph failed, rebuilding', e); host.innerHTML = html; }
}

/* ---------------- shell ---------------- */
function render() {
  const place = captureUI();
  const st = S.st;
  const v = U.verdictNow = (U.night && WX.data) || U.night ? P.verdict(U.night, WX.data, st) : null;
  paint($('#hdr'), `
    <div class="hrow">
      <div class="title">${U.view === 'tonight' ? 'Tonight' : U.view === 'schedule' ? 'Session plan' : U.view === 'quick' ? 'Quick pick' : U.view === 'targets' ? 'Targets' : U.view === 'gallery' ? 'My images' : U.view === 'horizon' ? 'Horizon' : 'Setup'}
        <div class="sub">${U.night ? esc(fmtDate(U.night.darkStart, st.tz)) + ' · ' + esc(st.place || '') : ''}</div></div>
      ${v && (U.view === 'tonight' || U.view === 'schedule') ? `<span class="verdict v-${v.level}">${v.level === 'go' ? 'Go' : v.level === 'marginal' ? 'Marginal' : 'Stay in'}</span>` : ''}
      <div class="datenav">
        <button data-act="day" data-n="-1" aria-label="Previous night">‹</button>
        <button data-act="today" aria-label="Tonight">•</button>
        <button data-act="day" data-n="1" aria-label="Next night">›</button>
      </div>
    </div>`);
  const body = U.busy ? skeleton()
    : U.view === 'tonight' ? viewTonight()
      : U.view === 'schedule' ? viewSchedule()
        : U.view === 'quick' ? viewQuick()
        : U.view === 'targets' ? viewTargets()
          : U.view === 'gallery' ? viewGallery()
            : U.view === 'horizon' ? viewHorizon() : viewSetup();
  /* never rebuild the view from under a finger that is dragging a slider */
  if (U.drag) { U.pendingRender = true; return; }
  paint($('#view'), body);
  document.querySelectorAll('nav.tabs button').forEach(b => {
    const on = b.dataset.v === U.view;
    b.setAttribute('aria-current', on);
    b.setAttribute('aria-selected', on);
    b.setAttribute('tabindex', on ? '0' : '-1');
  });
  afterRender();
  restoreUI(place);
}

/* What the page will look like, greyed out, rather than a spinner in a void */
function skeleton() {
  const bar = (h, w) => `<div class="skel" style="height:${h}px;width:${w};margin-bottom:8px"></div>`;
  return `<div class="card">${bar(22, '55%')}${bar(86, '100%')}${bar(14, '70%')}</div>
  <div class="card">${bar(16, '40%')}${bar(50, '100%')}</div>
  <div class="card">${bar(16, '45%')}${bar(50, '100%')}</div>
  <div class="sr" role="status">Working through the catalogue</div>`;
}

function afterRender() {
  document.querySelectorAll('canvas[data-tl]').forEach(c => drawTimeline(c));
  document.querySelectorAll('canvas[data-alt]').forEach(c => drawAltPlot(c, c.dataset.alt));
  document.querySelectorAll('canvas[data-hzprof]').forEach(c => {
    const p = S.horizon() || HZ.profile(); if (p) HZ.drawProfile(c, p, S.st);
  });
  if (U.view === 'horizon') hzRefresh();
  const qi = $('#qimg');
  if (qi && !qi.dataset.bound) {
    qi.dataset.bound = '1';
    const box = () => qi.closest('.fovbox');
    qi.onerror = () => { const b = box(); if (b) b.classList.add('noimg'); };
    qi.onload = () => { const b = box(); if (b) b.classList.remove('noimg'); };
  }
  if (U.view === 'targets') { const i = $('#tsearch'); if (i && U.focusSearch) { i.focus(); U.focusSearch = false; } }
}

/* ---------------- tonight ---------------- */
/* The moon does not always rise and set inside one night, and a dash where a
   time should be is the sort of thing that makes an app feel unfinished. */
function moonPhrase(nt, st) {
  const r = nt.moonrise, d = nt.moonset;
  if (r && d) return fmtTime(r, st.tz) + ' → ' + fmtTime(d, st.tz);
  if (!r && d) return 'up at dusk → ' + fmtTime(d, st.tz);
  if (r && !d) return fmtTime(r, st.tz) + ' → past dawn';
  return nt.moonUpFrac > 0.5 ? 'up all night' : 'down all night';
}

function viewTonight() {
  const st = S.st, nt = U.night;
  if (!nt) return `<div class="empty">Loading…</div>`;
  const f = A.fov(S.rig());
  const v = P.verdict(nt, WX.data, st);
  const darkMin = (nt.darkEnd - nt.darkStart) / 60000;
  const wxCard = weatherCard();
  const nShow = U.cands ? U.cands.length : 0;
  const top = U.cands ? U.cands.slice(0, 3) : [];
  return `
  ${S.fresh && !st.confirmed ? `<div class="card">
    <h2>Set for ${esc(st.place || 'here')}</h2>
    <div class="dim" style="margin-top:6px">Planning from ${st.lat.toFixed(2)}°, ${st.lon.toFixed(2)}° with a
      ${esc(S.rig().label)}. Everything below rests on those two being right.</div>
    <div class="btnrow" style="margin-top:12px">
      <button class="btn primary" data-act="confirmsetup">That's right</button>
      <button class="btn" data-act="geo">Use my exact location</button>
      <button class="btn ghost" data-act="tab" data-v="setup">Change the rig</button>
    </div>
  </div>` : ''}
  <div class="card">
    <div class="row spread" style="align-items:flex-start">
      <div>
        <h2>${esc(fmtTime(nt.darkStart, st.tz))} – ${esc(fmtTime(nt.darkEnd, st.tz))}</h2>
        <div class="dim">${dur(darkMin)} of ${st.twilight} darkness</div>
      </div>
      <div style="text-align:right">
        <div class="stat"><b>${Math.round(nt.moonIllum * 100)}%</b>moon ${nt.moonWaxing ? 'waxing' : 'waning'}</div>
      </div>
    </div>
    <canvas data-tl="1" style="width:100%;height:86px" class="tl"></canvas>
    <div class="grid2" style="margin-top:10px">
      <div class="stat"><b>${esc(fmtTime(nt.sunset, st.tz))} → ${esc(fmtTime(nt.sunrise, st.tz))}</b>sun down / up</div>
      <div class="stat"><b>${esc(moonPhrase(nt, st))}</b>moon</div>
      <div class="stat"><b>${Math.round(nt.moonMaxAlt)}°</b>moon peak while dark</div>
      <div class="stat"><b>${Math.round(nt.moonUpFrac * 100)}%</b>of the dark hours with moon up</div>
    </div>
    ${v.why.filter(x => x !== 'no forecast loaded').length
      ? `<div class="why">${esc(v.why.filter(x => x !== 'no forecast loaded').join(' · '))}</div>` : ''}
  </div>

  ${wxCard}

  <div class="card">
    <div class="row spread"><h3>Session</h3><span class="dim">${nShow} targets pass your filters</span></div>
    <div class="grid2" style="margin-top:8px">
      <div class="stat" style="grid-column:1/-1"><b>${esc(S.rig().label || 'Custom')}</b>${f.w.toFixed(2)}° × ${f.h.toFixed(2)}°${f.scale ? ' · ' + f.scale.toFixed(2) + '″/px' : ''}</div>
      <div class="stat"><b>${st.minTargets}–${st.maxTargets}</b>targets, ${st.blockMin}–${st.blockMax} min each</div>
    </div>
    <div class="btnrow" style="margin-top:12px">
      <button class="btn primary" data-act="build">Build the schedule</button>
      <button class="btn" data-act="interactive">Pick as I go</button>
    </div>
    ${pinList().length ? `<div class="dim" style="margin-top:8px">Forced in: ${pinList().map(p => esc(p.name)).join(', ')}</div>` : ''}
  </div>

  ${top.length ? `<div class="card"><div class="row spread"><h3>Best of the night</h3>
    <button class="btn sm ghost" data-act="season">Year ahead</button></div><ul class="list">
    ${top.map(c => rowFor(c)).join('')}</ul></div>` : ''}
  `;
}

function weatherCard() {
  const st = S.st, nt = U.night;
  if (WX.loading) return `<div class="card tight"><span class="spin"></span> Fetching the forecast…</div>`;
  if (!WX.data) return `<div class="card tight"><div class="row spread"><span class="dim">${WX.error ? 'Forecast unavailable — no connection' : 'Forecast not loaded yet'}</span>
    <button class="btn sm" data-act="wx">Load weather</button></div></div>`;
  const h = WX.data.hours.filter(x => x.t >= nt.darkStart - 3600000 && x.t <= nt.darkEnd + 3600000);
  if (!h.length) return `<div class="card tight"><div class="row spread"><span class="dim">The forecast doesn't reach this night yet</span><button class="btn sm" data-act="wx">Refresh</button></div></div>`;
  const bar = (x, i) => {
    const c = x.cloud, col = c <= 20 ? 'var(--green)' : c <= 45 ? 'var(--teal)' : c <= 70 ? 'var(--amber)' : 'var(--red)';
    return `<div data-i="${i}" title="${esc(fmtTime(x.t, st.tz))} ${c}% cloud"
      style="height:${Math.max(6, c)}%;background:${col};opacity:${x.rain > 40 ? .55 : 1}"></div>`;
  };
  /* one label every couple of hours, and a line that follows your finger */
  const marks = h.map((x, i) => ({ x, i }))
    .filter(({ x }) => +new Intl.DateTimeFormat('en-GB', { hour: '2-digit', hour12: false, timeZone: st.tz }).format(new Date(x.t)) % 3 === 0);
  U.wxHours = h.map(x => ({ t: x.t, c: x.cloud, temp: x.temp, dew: x.dew, rain: x.rain, wind: x.wind }));
  const mid = h[Math.floor(h.length / 2)];
  const spread = mid ? (mid.temp - mid.dew) : null;
  return `<div class="card">
    <div class="row spread"><h3>Cloud cover through the night</h3><button class="btn sm ghost" data-act="wx">↻</button></div>
    <div class="wx" data-act="wxscrub">${h.map(bar).join('')}</div>
    <div class="wxticks">${marks.map(({ x, i }) => `<span style="left:${((i + .5) / h.length * 100).toFixed(2)}%">${esc(fmtTime(x.t, st.tz).replace(/:00$/, ''))}</span>`).join('')}</div>
    <div class="wxread" id="wxread">Drag across for the hour-by-hour numbers</div>
    <div class="grid3" style="margin-top:10px">
      <div class="stat"><b>${Math.round(mid.temp)}°C</b>temp at midnight</div>
      <div class="stat"><b>${spread != null ? spread.toFixed(1) + '°' : '—'}</b>dew spread${spread != null && spread < 2 ? ' · dew risk' : ''}</div>
      <div class="stat"><b>${Math.round(Math.max(...h.map(x => x.wind)))} km/h</b>peak gust</div>
    </div></div>`;
}

function rowFor(c, extra) {
  const o = c.o, fill = (c.fr.fill * 100);
  return `<li data-act="obj" data-n="${esc(o.n)}">
    <div class="nm"><b>${esc(label(o))}</b>
      <span class="meta"><span class="pill t-${o.t}">${esc(P.TYPES[o.t])}</span>
        ${o.mj >= 60 ? (o.mj / 60).toFixed(1) + '°' : o.mj.toFixed(1) + "′"} · fills ${Math.round(fill)}% · ${Math.round(c.w.maxAlt)}° peak</span>
      ${extra || ''}</div>
    <span class="sc" title="Match score out of 100">${Math.round(c.total)}</span></li>`;
}

/* ---------------- schedule ---------------- */
function viewSchedule() {
  const st = S.st, nt = U.night;
  if (!nt) return `<div class="empty">Loading…</div>`;
  if (U.interactive) return viewInteractive();
  if (!U.sched) return `<div class="empty">No schedule yet.<div class="btnrow" style="justify-content:center;margin-top:14px">
    <button class="btn primary" data-act="build">Build the schedule</button>
    <button class="btn" data-act="interactive">Pick as I go</button></div>
    ${timingCard()}</div>`;
  const bl = U.sched.blocks.slice().sort((a, b) => a.s - b.s);
  const totalMin = bl.reduce((a, b) => a + (b.e - b.s) / 60000, 0);
  const gapList = P.gaps(nt, bl, st, 15);
  U.gapIndex = {};
  for (const g of gapList) U.gapIndex[String(g.s)] = g;

  /* blocks and gaps down the page in the order the night runs */
  const items = bl.map((b, i) => ({ s: b.s, html: blockCard(b, U.sched.blocks.indexOf(b)) }))
    .concat(gapList.map(g => ({ s: g.s, html: gapCard(g) })))
    .sort((a, b) => a.s - b.s);

  return `
  <div class="card">
    <canvas data-tl="1" style="width:100%;height:86px" class="tl"></canvas>
    <div class="row spread" style="margin-top:8px">
      <span class="dim">${bl.length} targets · ${dur(totalMin)} on sky · ${Math.round(U.sched.coverage * 100)}% of the dark window</span>
    </div>
    <div class="btnrow" style="margin-top:10px">
      <button class="btn sm" data-act="build">Different targets</button>
      <button class="btn sm" data-act="shuffle">Different mix of types</button>
      <button class="btn sm" data-act="addtarget">+ Add a target</button>
      <button class="btn sm" data-act="interactive">Pick as I go</button>
      <button class="btn sm" data-act="export">Export</button>
    </div>
    ${pinList().length ? `<div class="row spread" style="margin-top:8px">
      <span class="dim">Kept in: ${pinList().map(p => esc(p.name)).join(', ')}</span>
      <button class="btn sm ghost" data-act="clearpins">Clear</button></div>` : ''}
  </div>
  ${timingCard()}
  ${items.map(x => x.html).join('')}
  <div class="card tight"><span class="dim">Tap a target for framing and detail. ↻ cycles through what else fits that
    slot; lock or retime a block and the rest rebuilds around it.</span></div>`;
}

function blockCard(b, i) {
  const st = S.st, c = b.c, o = c ? c.o : byName(b.name);
  const logged = integTotal(b.name);
  const fin = isDone(b.name);
  const mins = (b.e - b.s) / 60000;
  const subs = Math.floor(mins * 60 / (st.subLen || 60) * 0.92);
  const w = c ? c.w : null;
  const alt = w ? altAtTime(o, b.s + (b.e - b.s) / 2) : null;
  const parts = c ? c.parts : null;
  const lockd = U.pinned.find(p => p.name === b.name);
  return `<div class="blockcard ${lockd ? 'locked' : ''}">
    <div class="row spread">
      <div style="min-width:0">
        <div class="timerange">${esc(fmtTime(b.s, st.tz))} – ${esc(fmtTime(b.e, st.tz))} <span class="dim">${dur(mins)}</span></div>
        <h2 data-act="obj" data-n="${esc(o.n)}" style="cursor:pointer">${esc(label(o))}</h2>
      </div>
      <span class="sc" title="Match score out of 100">${c ? Math.round(c.total) : ''}</span>
    </div>
    <div class="row wrap" style="gap:6px;margin-top:6px">
      <span class="pill t-${o.t}">${esc(P.TYPES[o.t])}</span>
      <span class="pill">${o.mj >= 60 ? (o.mj / 60).toFixed(1) + '°' : o.mj.toFixed(1) + '′'}</span>
      ${c ? `<span class="pill">${Math.round(c.fr.fill * 100)}% of frame</span>` : ''}
      <span class="pill">${alt ? Math.round(alt.alt) + '° ' + compass(alt.az) : ''}</span>
      ${c ? `<span class="pill">moon ${Math.round(c.msep)}°</span>` : ''}
      ${o.cn ? `<span class="pill">${esc(o.cn)}</span>` : ''}
    </div>
    <canvas data-alt="${esc(o.n)}" class="altplot" style="margin-top:8px"></canvas>
    <div class="why">${esc(whyText(c, b))}</div>
    ${parts ? `<details><summary>Score breakdown</summary><div class="bars">${barsFor(parts)}</div>
      <div class="dim" style="margin-top:6px">${subs} subs of ${st.subLen || 60}s allowing for overheads</div></details>` : ''}
    ${logged ? `<div class="dim" style="margin-top:8px">${dur(logged)} logged on this so far${fin ? ', and finished for the season' : ''}</div>` : ''}
    <div class="btnrow" style="margin-top:10px">
      <button class="btn sm primary" data-act="logblock" data-n="${esc(o.n)}" data-mins="${Math.round(mins)}">+ Log ${dur(mins)}</button>
      <button class="btn sm ${fin ? 'ghost' : ''}" data-act="seasondone" data-n="${esc(o.n)}">
        ${fin ? '✓ Done for the season' : 'Done for the season'}</button>
      <button class="btn sm" data-act="cycle" data-i="${i}">↻ Another</button>
      <button class="btn sm" data-act="swap" data-i="${i}">Swap target</button>
    </div>
    <details style="margin-top:2px"><summary>More for this block</summary>
      <div class="btnrow" style="margin-top:6px">
        <button class="btn sm" data-act="retime" data-i="${i}">Change the window</button>
        <button class="btn sm" data-act="lock" data-i="${i}">${lockd ? 'Unlock the window' : 'Lock the window'}</button>
        <button class="btn sm ghost" data-act="logmore" data-n="${esc(o.n)}">Log a different amount</button>
        <button class="btn sm ghost bad" data-act="drop" data-i="${i}">Remove from the plan</button>
      </div>
    </details>
  </div>`;
}

function barsFor(parts) {
  const order = ['framing', 'type', 'altitude', 'window', 'popularity', 'brightness', 'moon', 'progress'];
  const label = { framing: 'Framing', type: 'Type preference', altitude: 'Altitude', window: 'Window length', popularity: 'Popularity', brightness: 'Brightness', moon: 'Moon penalty', progress: 'Time already on it' };
  const max = Math.max(...order.map(k => Math.abs(S.st.weights[k] || 0)));
  return order.filter(k => k !== 'progress' || Math.abs(parts.progress || 0) > 0.05).map(k => {
    const v = parts[k] || 0, neg = v < 0, pct = Math.min(100, Math.abs(v) / max * 100);
    return `<span class="bl">${label[k]}</span><span class="track"><span class="fill ${neg ? 'neg' : ''}" style="width:${pct}%"></span></span><span class="bv">${v > 0 ? '+' : ''}${v.toFixed(1)}</span>`;
  }).join('');
}

function whyText(c, b) {
  if (!c) return 'Locked in manually.';
  const o = c.o, bits = [];
  const fill = c.fr.fill;
  bits.push(fill > 1.05 ? `overflows the frame at ${Math.round(fill * 100)}% — expect a crop or a ${c.fr.tilesNeeded}-panel mosaic`
    : fill >= 0.3 ? `fills ${Math.round(fill * 100)}% of the frame` : `small in this rig at ${Math.round(fill * 100)}% of the frame`);
  bits.push(`peaks at ${Math.round(c.w.maxAlt)}° (airmass ${A.airmass(c.w.maxAlt).toFixed(2)})`);
  if (c.msep < 45) bits.push(`only ${Math.round(c.msep)}° from the moon`);
  else if (U.night.moonIllum > 0.3) bits.push(`${Math.round(c.msep)}° clear of the moon`);
  if (c.prefEff > 1.15) bits.push('a type you asked for more of');
  if (o.p >= 85) bits.push('a well-known showpiece');
  else if (o.p <= 25) bits.push('rarely imaged');
  if (S.st.bortle >= 6 && o.sb !== '' && o.sb > 23) bits.push('low surface brightness for your sky');
  return bits.join('; ') + '.';
}

function altAtTime(o, t) {
  const st = S.st;
  return A.altaz(t, st.lat, st.lon, o.ra, o.d);
}
function compass(az) {
  const d = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
  return d[Math.round(((az % 360) + 360) % 360 / 22.5) % 16];
}

function viewInteractive() {
  const st = S.st, iv = U.interactive;
  const gap = (st.gapMin || 0) * 60000, minB = st.blockMin * 60000, maxB = st.blockMax * 60000;
  const remain = U.night.darkEnd - iv.cursor;
  const done = iv.blocks.length >= st.maxTargets || remain < minB;
  const avail = Math.min(maxB, remain);
  const opts = done ? [] : P.alternatives(U.cands, iv.cursor, iv.cursor + avail,
    iv.blocks.map(b => b.name), iv.n || 5)
    .map(c => {
      const seg = c.w.segs.find(s => s.e > iv.cursor) || c.w.segs[0];
      const s = Math.max(seg.s, iv.cursor), e = Math.min(seg.e, iv.cursor + avail);
      const pl = P.bestPlacement(seg, s, e, Math.min(e - s, maxB));
      return { c, s: pl.s, e: pl.s + Math.min(e - s, maxB) };
    })
    .filter(x => x.e - x.s >= minB);
  return `
  <div class="card">
    <div class="row spread"><h3>Slot ${iv.blocks.length + 1}</h3>
      <span class="dim">from ${esc(fmtTime(iv.cursor, st.tz))} · ${dur(remain / 60000)} left</span></div>
    ${iv.blocks.length ? `<div class="dim" style="margin-top:6px">So far: ${iv.blocks.map(b => esc(b.name) + ' ' + fmtTime(b.s, st.tz)).join(' → ')}</div>` : ''}
    <div class="btnrow" style="margin-top:10px">
      <button class="btn sm" data-act="ivn" data-n="5" ${(iv.n || 5) === 5 ? 'disabled' : ''}>Top 5</button>
      <button class="btn sm" data-act="ivn" data-n="10" ${(iv.n || 5) === 10 ? 'disabled' : ''}>Top 10</button>
      <button class="btn sm" data-act="ivn" data-n="25" ${(iv.n || 5) === 25 ? 'disabled' : ''}>Top 25</button>
      <button class="btn sm ghost" data-act="ivskip">Skip 30 min</button>
      <button class="btn sm ghost" data-act="ivdone">Finish</button>
    </div>
  </div>
  ${done ? `<div class="card"><h3>That's the night filled</h3><div class="dim" style="margin-top:6px">
      ${iv.blocks.length} targets chosen.</div>
      <div class="btnrow" style="margin-top:10px"><button class="btn primary" data-act="ivdone">Use this plan</button></div></div>`
      : opts.length ? opts.map((x, i) => `
    <div class="blockcard">
      <div class="row spread">
        <div style="min-width:0">
          <div class="timerange">${esc(fmtTime(x.s, st.tz))} – ${esc(fmtTime(x.e, st.tz))} <span class="dim">${dur((x.e - x.s) / 60000)}</span></div>
          <h2 data-act="obj" data-n="${esc(x.c.o.n)}" style="cursor:pointer">${esc(label(x.c.o))}</h2>
        </div><span class="sc" title="Score for this slot: tonight's score adjusted for how well it fits these hours">${Math.round(x.c.fitScore != null ? x.c.fitScore : x.c.total)}</span>
      </div>
      <div class="row wrap" style="gap:6px;margin-top:6px">
        <span class="pill t-${x.c.o.t}">${esc(P.TYPES[x.c.o.t])}</span>
        <span class="pill">${Math.round(x.c.total)} tonight</span>
        <span class="pill">${Math.round(x.c.fr.fill * 100)}% of frame</span>
        <span class="pill">peaks ${Math.round(x.c.w.maxAlt)}°</span>
      </div>
      <div class="why">${esc(whyText(x.c, x))}</div>
      <div class="btnrow" style="margin-top:8px">
        <button class="btn primary sm" data-act="ivpick" data-i="${i}">Take this slot</button>
      </div>
    </div>`).join('')
      : `<div class="empty">Nothing fits this slot. Skip ahead or finish.</div>`}`;
}

/* ---------------- drawing ---------------- */
function drawTimeline(canvas) {
  const st = S.st, nt = U.night;
  const cw = canvas.clientWidth, ch = 86;
  canvas.width = cw * devicePixelRatio; canvas.height = ch * devicePixelRatio;
  const cx = canvas.getContext('2d');
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  cx.clearRect(0, 0, cw, ch);
  const t0 = nt.sunset ?? nt.darkStart, t1 = nt.sunrise ?? nt.darkEnd;
  const X = t => (t - t0) / (t1 - t0) * cw;
  const css = getComputedStyle(document.body);
  const col = n => css.getPropertyValue(n).trim() || '#888';
  // twilight bands
  cx.fillStyle = 'rgba(60,80,120,.20)'; cx.fillRect(0, 0, cw, ch);
  cx.fillStyle = 'rgba(8,10,16,.85)'; cx.fillRect(X(nt.darkStart), 0, X(nt.darkEnd) - X(nt.darkStart), ch);
  // cloud
  if (WX.data) {
    const hrs = WX.data.hours.filter(x => x.t >= t0 - 3600000 && x.t <= t1 + 3600000);
    for (const h of hrs) {
      const x = X(h.t), w = Math.max(2, cw / Math.max(1, (t1 - t0) / 3600000));
      cx.fillStyle = `rgba(190,200,215,${(h.cloud / 100) * 0.30})`;
      cx.fillRect(x - w / 2, 0, w, ch);
      if (h.rain >= 40) { cx.fillStyle = 'rgba(120,160,220,.22)'; cx.fillRect(x - w / 2, 0, w, ch); }
    }
  }
  // moon altitude curve
  cx.beginPath();
  for (let t = t0, first = true; t <= t1; t += 600000) {
    const m = A.moon(t), p = A.altaz(t, st.lat, st.lon, m.ra, m.dec);
    const y = ch - 6 - Math.max(0, p.alt) / 90 * (ch - 14);
    if (first) { cx.moveTo(X(t), y); first = false; } else cx.lineTo(X(t), y);
  }
  cx.strokeStyle = `rgba(200,200,170,${0.25 + 0.6 * nt.moonIllum})`;
  cx.lineWidth = 1.4; cx.setLineDash([4, 3]); cx.stroke(); cx.setLineDash([]);
  // hour ticks
  cx.font = '9.5px ui-sans-serif,system-ui';
  const startH = Math.ceil(t0 / 3600000) * 3600000;
  for (let t = startH; t <= t1; t += 3600000) {
    const lt = fmtTime(t, st.tz);
    if (!lt.endsWith('00')) continue;
    cx.fillStyle = 'rgba(255,255,255,.07)'; cx.fillRect(X(t), 0, 1, ch);
    if (+lt.slice(0, 2) % 2 === 0) { cx.fillStyle = col('--ink3'); cx.fillText(lt.slice(0, 2), X(t) + 2, ch - 2); }
  }
  // blocks
  if (U.sched) {
    U.sched.blocks.forEach((b, i) => {
      const x = X(b.s), w = Math.max(10, X(b.e) - X(b.s));
      cx.fillStyle = 'rgba(233,161,59,.24)'; cx.strokeStyle = col('--amber'); cx.lineWidth = 1;
      roundRect(cx, x, 18, w, 44, 4); cx.fill(); cx.stroke();
      cx.fillStyle = col('--ink'); cx.font = '10px ui-sans-serif,system-ui';
      cx.save(); cx.beginPath(); cx.rect(x, 18, w, 44); cx.clip();
      cx.fillText(b.name, x + 3, 31);
      const c = b.c; if (c) cx.fillText(Math.round(c.w.maxAlt) + '°', x + 3, 44);
      cx.restore();
    });
  }
  cx.strokeStyle = col('--line'); cx.lineWidth = 1; cx.strokeRect(.5, .5, cw - 1, ch - 1);
}
function roundRect(cx, x, y, w, h, r) {
  cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r);
  cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath();
}

function drawAltPlot(canvas, name, scrub) {
  const o = objFor(byName(name)); if (!o) return;
  const st = S.st, nt = U.night;
  const cw = canvas.clientWidth, ch = 70;
  canvas.width = cw * devicePixelRatio; canvas.height = ch * devicePixelRatio;
  const cx = canvas.getContext('2d');
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  cx.clearRect(0, 0, cw, ch);
  const t0 = nt.sunset ?? nt.darkStart, t1 = nt.sunrise ?? nt.darkEnd;
  const X = t => (t - t0) / (t1 - t0) * cw, Y = a => ch - 8 - Math.max(0, a) / 90 * (ch - 12);
  const css = getComputedStyle(document.body), col = n => css.getPropertyValue(n).trim();
  // horizon / limit band
  const hz = S.horizon();
  cx.beginPath(); cx.moveTo(0, ch);
  for (let t = t0; t <= t1; t += 600000) {
    const p = A.altaz(t, st.lat, st.lon, o.ra, o.d);
    let lim = st.altLimit;
    if (hz && st.useHorizon) lim = Math.max(lim, A.horizonAt(hz, p.az));
    cx.lineTo(X(t), Y(lim));
  }
  cx.lineTo(cw, ch); cx.closePath();
  cx.fillStyle = 'rgba(212,89,92,.13)'; cx.fill();
  // dark window
  cx.fillStyle = 'rgba(127,209,222,.06)';
  cx.fillRect(X(nt.darkStart), 0, X(nt.darkEnd) - X(nt.darkStart), ch);
  // curve
  cx.beginPath();
  for (let t = t0, first = true; t <= t1; t += 300000) {
    const p = A.altaz(t, st.lat, st.lon, o.ra, o.d);
    const y = Y(p.alt);
    if (first) { cx.moveTo(X(t), y); first = false; } else cx.lineTo(X(t), y);
  }
  cx.strokeStyle = col('--teal'); cx.lineWidth = 1.8; cx.stroke();
  // scheduled span
  const b = U.sched && U.sched.blocks.find(x => x.name === name);
  if (b) {
    cx.fillStyle = 'rgba(233,161,59,.18)'; cx.fillRect(X(b.s), 0, X(b.e) - X(b.s), ch);
    cx.strokeStyle = col('--amber'); cx.lineWidth = 1;
    cx.strokeRect(X(b.s), .5, X(b.e) - X(b.s), ch - 1);
  }
  /* hour marks, so a curve is readable as a time of night rather than a shape */
  cx.font = '9px ui-sans-serif,system-ui';
  const step = (t1 - t0) > 10 * 3600000 ? 2 : 1;
  const d0 = new Date(t0); d0.setMinutes(0, 0, 0);
  for (let t = d0.getTime(); t <= t1; t += 3600000) {
    if (t < t0) continue;
    const hr = +new Intl.DateTimeFormat('en-GB', { hour: '2-digit', hour12: false, timeZone: st.tz }).format(new Date(t));
    if (hr % step) continue;
    const x = X(t);
    cx.strokeStyle = 'rgba(255,255,255,.07)'; cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, ch - 10); cx.stroke();
    cx.fillStyle = col('--ink3');
    cx.fillText(String(hr).padStart(2, '0'), x + 2, ch - 1);
  }
  cx.fillStyle = col('--ink3'); cx.font = '9.5px ui-sans-serif,system-ui';
  cx.fillText('90°', 2, 9); cx.fillText('0°', 2, ch - 12);

  /* dragging a finger across reads out the time and altitude under it */
  if (scrub != null) {
    const t = t0 + Math.max(0, Math.min(1, scrub)) * (t1 - t0);
    const p = A.altaz(t, st.lat, st.lon, o.ra, o.d);
    const x = X(t), y = Y(p.alt);
    cx.strokeStyle = col('--amber'); cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, ch); cx.stroke();
    cx.beginPath(); cx.arc(x, y, 3, 0, 7); cx.fillStyle = col('--amber'); cx.fill();
    const txt = fmtTime(t, st.tz) + '  ' + Math.round(p.alt) + '°  ' + compass(p.az);
    cx.font = '10.5px ui-sans-serif,system-ui';
    const w = cx.measureText(txt).width + 10;
    const bx = Math.max(2, Math.min(cw - w - 2, x - w / 2));
    cx.fillStyle = 'rgba(8,10,16,.85)';
    cx.fillRect(bx, 2, w, 15);
    cx.strokeStyle = 'rgba(233,161,59,.5)'; cx.strokeRect(bx + .5, 2.5, w - 1, 14);
    cx.fillStyle = col('--ink'); cx.fillText(txt, bx + 5, 13);
  }
}

/* ---------------- targets ---------------- */
function viewTargets() {
  const st = S.st;
  if (U.tmode === 'season') return `
  <div class="card tight"><div class="chips">
    <button class="chip" aria-pressed="false" data-act="tmode" data-k="cat">Catalogue</button>
    <button class="chip" aria-pressed="true" data-act="tmode" data-k="season">Year ahead</button>
  </div></div>` + viewSeason();
  const q = U.tq.trim().toLowerCase();
  const scored = {};
  if (U.cands) for (const c of U.cands) scored[c.o.n] = c;
  let list = DB.map(objFor).filter(o => {
    if (q) {
      const hay = (o.n + ' ' + o.c + ' ' + (o.al || []).join(' ') + ' ' + o.cn).toLowerCase();
      if (!hay.includes(q)) return false;
    } else {
      if (!st.types[o.t]) return false;
      if (o.mj < st.sizeMin || o.mj > st.sizeMax) return false;
      if (st.cats.length && !o.ct.some(c => st.cats.includes(c))) return false;
      if (U.tsort === 'score' && !scored[o.n]) return false;
      if (U.tsort === 'score' && isDone(o.n)) return false;
      if (st.hideImaged && U.tsort === 'score' && integTotal(o.n) > 0) return false;
    }
    return true;
  });
  const cmp = {
    score: (a, b) => (scored[b.n] ? scored[b.n].total : -1) - (scored[a.n] ? scored[a.n].total : -1),
    pop: (a, b) => b.p - a.p, size: (a, b) => b.mj - a.mj,
    name: (a, b) => a.n.localeCompare(b.n, undefined, { numeric: true }),
    alt: (a, b) => A.transitAlt(st.lat, b.d) - A.transitAlt(st.lat, a.d),
  }[U.tsort];
  list.sort(cmp);
  const total = list.length;
  U.tlist = list;                         /* the scroll handler paints rows from this */
  U.tscored = scored;
  const shot = shotNames();
  const mCount = [...shot].filter(n => (byName(n) || {}).m).length;
  const iCount = shot.size;
  const w = { s: 0, e: Math.min(total, Math.ceil(window.innerHeight / TROW) + TPAD * 2) };
  U.tvs = w.s; U.tve = w.e;
  return `
  <div class="card tight"><div class="chips">
    <button class="chip" aria-pressed="true" data-act="tmode" data-k="cat">Catalogue</button>
    <button class="chip" aria-pressed="false" data-act="tmode" data-k="season">Year ahead</button>
  </div></div>
  <div class="searchbar">
    <input id="tsearch" type="text" enterkeyhint="search" autocomplete="off" placeholder="Search name, common name or constellation" value="${esc(U.tq)}" data-act="search">
    <div class="chips" style="margin-top:8px">
      ${[['score', 'Best tonight'], ['pop', 'Most imaged'], ['size', 'Largest'], ['alt', 'Highest here'], ['name', 'A–Z']]
      .map(([k, l]) => `<button class="chip" aria-pressed="${U.tsort === k}" data-act="tsort" data-k="${k}">${l}</button>`).join('')}
    </div>
  </div>
  <div class="card tight"><div class="row spread">
    <span class="dim">${total} objects${U.tsort === 'score' ? ' visible tonight' : ' in the catalogue'}</span>
    <span class="dim">imaged ${iCount} · Messier ${mCount}/110</span>
  </div></div>
  ${total ? `<div class="card"><div class="tvirt" style="height:${total * TROW}px">
    <ul class="list" id="trows">${targetRows(w.s, w.e)}</ul>
  </div></div>` : `<div class="empty">Nothing matches. Widen the filters in Setup.</div>`}
  ${iCount ? `<div class="card"><details><summary>What I've shot (${iCount})</summary><ul class="list">
    ${[...shot].sort().map(n => `<li><div class="nm"><b>${esc(n)}</b>
      <span class="meta">${integTotal(n) ? dur(integTotal(n)) + ' logged' : 'no time logged'}${isDone(n) ? ' · finished for the season' : ''}</span></div>
      ${isDone(n) ? `<button class="btn sm ghost" data-act="seasondone" data-n="${esc(n)}">Put back</button>`
        : `<button class="btn sm ghost" data-act="seasondone" data-n="${esc(n)}">Finish</button>`}</li>`).join('')}
  </ul></details></div>` : ''}`;
}

/* one screenful of rows, positioned by index so scrolling stays honest */
function targetRows(from, to) {
  const list = U.tlist || [], scored = U.tscored || {};
  let out = '';
  for (let i = from; i < to && i < list.length; i++) {
    const o = list[i];
    const c = scored[o.n], im = integTotal(o.n) > 0 || S.imaged[o.n], bn = S.banned[o.n], fin = isDone(o.n);
    const pn = isPinned(o.n);
    const shots = IMG.for(o.n).length;
    out += `<li class="trow" style="top:${i * TROW}px" data-act="obj" data-n="${esc(o.n)}" data-i="${i}">
      <div class="nm">
        <b>${im ? '✓ ' : ''}${bn ? '✕ ' : ''}${pn ? '📌 ' : ''}${esc(label(o))}</b>
        <span class="meta"><span class="pill t-${o.t}">${esc(P.TYPES[o.t])}</span>
          ${o.mj >= 60 ? (o.mj / 60).toFixed(1) + '°' : o.mj.toFixed(1) + '′'}${o.v !== '' ? ' · mag ' + o.v : ''}${U.tsort === 'pop' ? ' · pop ' + o.p : ''}${c ? ' · ' + Math.round(c.w.maxAlt) + '° peak' : ''}${shots ? ' · ' + shots + ' shot' + (shots > 1 ? 's' : '') : ''}${integTotal(o.n) ? ' · ' + dur(integTotal(o.n)) : ''}</span>
      </div>${c ? `<span class="sc" title="Match score out of 100">${Math.round(c.total)}</span>` : ''}</li>`;
  }
  return out;
}

/* ---------------- object sheet ---------------- */
function openSheet(html) {
  removeSheet();                      /* only ever one sheet at a time */
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet';
  bg.innerHTML = `<div class="sheet"><div class="handle"></div>${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  document.body.appendChild(bg);
  initSheetDrag(bg);
  /* one history entry per run of sheets, so the back button closes instead of leaving */
  if (!U.sheetHist) { U.sheetHist = true; try { history.pushState({ np: 'sheet' }, ''); } catch (e) { } }
  return bg;
}
function removeSheet() { const s = $('#sheet'); if (s) s.remove(); }
function closeSheet() {
  removeSheet();
  if (U.sheetHist) { U.sheetHist = false; try { history.back(); } catch (e) { } }
}

/* ---------------- swap / retime ---------------- */
function swapSheet(i) {
  const b = U.sched.blocks[i], st = S.st;
  const q = (U.swapq || '').trim();
  const others = U.sched.blocks.map(x => x.name).filter(n => n !== b.name);
  const alts = P.alternatives(U.cands, b.s, b.e, others, 25, st);
  const found = q.length >= 2 ? searchObjects(q, 14) : [];
  const rows = cs => cs.map(c => `<li>
      <div class="nm" data-act="obj" data-n="${esc(c.o.n)}" style="min-width:0"><b>${esc(label(c.o))}</b>
        <span class="meta"><span class="pill t-${c.o.t}">${esc(P.TYPES[c.o.t])}</span>
          ${Math.round(c.fr.fill * 100)}% of frame · peaks ${Math.round(c.w.maxAlt)}° · covers ${Math.round(c.fit.frac * 100)}% of the slot</span></div>
      <span class="sc" title="Score for this slot">${Math.round(c.fitScore)}</span>
      <button class="btn sm primary" data-act="doswap" data-i="${i}" data-n="${esc(c.o.n)}">Use</button></li>`).join('');
  openSheet(`
    <div class="row spread"><h2>Swap ${esc(b.name)}</h2><button class="btn sm ghost" data-act="closesheet">Close</button></div>
    <div class="dim" style="margin:6px 0 10px">Window ${esc(fmtTime(b.s, st.tz))} – ${esc(fmtTime(b.e, st.tz))}</div>
    <div class="field">
      <input type="text" id="swapq" placeholder="Or search the whole catalogue" value="${esc(U.swapq || '')}"
        data-act="swapq" data-i="${i}" autocomplete="off">
    </div>
    ${q.length >= 2 ? `<h3 style="margin-top:12px">Matches for “${esc(q)}”</h3>
      ${found.length ? `<ul class="list">${found.map(o => pickRow(o, 'doswap', 'data-i="' + i + '"')).join('')}</ul>`
        : '<div class="dim">Nothing matches.</div>'}
      <div class="dim">Anything up tonight can be used here, even if Setup's filters hide it.</div>
      <h3 style="margin-top:14px">Best for this slot</h3>` : ''}
    <div class="dim" style="margin:8px 0 2px">Ordered for this window: tonight's score adjusted for how much of the
      slot each one covers and how high it sits in it.</div>
    <ul class="list">${rows(alts) || '<div class="empty">Nothing else fits this window.</div>'}</ul>`);
  if (q.length >= 2) {
    const inp = $('#swapq');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
}

function hzRefresh() {
  const c = $('#hzcanvas'); if (!c || !HZ.has) return;
  HZ.drawEditor(c, U.hzThresh ?? 0.18);
  const p = $('#hzprofile'); if (p) HZ.drawProfile(p, HZ.profile(), S.st);
  if (!c.dataset.bound) {
    c.dataset.bound = '1';
    const handle = e => {
      if (e.buttons === 0 && e.type === 'pointermove') return;
      const r = c.getBoundingClientRect();
      const xf = (e.clientX - r.left) / r.width, yf = (e.clientY - r.top) / r.height;
      if (U.hzTool === 'horizon') HZ.cal.horizonRow = Math.min(.98, Math.max(.02, yf));
      else if (U.hzTool === 'ref') HZ.cal.refRow = Math.min(.98, Math.max(.02, yf));
      else HZ.paintAt(xf, yf, U.hzBrush ?? 0.05);
      hzRefresh(); e.preventDefault();
    };
    c.addEventListener('pointerdown', handle);
    c.addEventListener('pointermove', handle);
  }
}

const clampToTime = mins => {
  const t = (12 * 60 + mins) % 1440;
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
};

/* ============================================================
   Plan page extras: session timing where you are actually using
   it, empty gaps that suggest their own targets, one-tap cycling
   through alternatives, and a search that reaches the whole
   catalogue rather than only tonight's shortlist.
   ============================================================ */

/* any object at all, ignoring the Setup filters — so a search can find things
   the shortlist has filtered out */
function candFor(name) {
  const hit = U.cands && U.cands.find(c => c.o.n === name);
  if (hit) return hit;
  const o = byName(name); if (!o || !U.night) return null;
  const q = objFor(o);
  const epoch = (U.night.darkStart + U.night.darkEnd) / 2;
  const pc = A.precess(q.ra, q.d, epoch);
  return P.score({ ...q, ra: pc.ra, d: pc.dec, ra0: q.ra, d0: q.d },
    S.st, U.night, S.horizon(), A.fov(S.rig()), { integ: S.integ, grid: U.grid });
}

function searchObjects(q, limit = 14) {
  const s = (q || '').trim().toLowerCase();
  if (s.length < 2) return [];
  const hits = [];
  for (const o of DB) {
    const hay = (o.n + ' ' + o.c + ' ' + (o.al || []).join(' ') + ' ' + o.cn).toLowerCase();
    if (hay.includes(s)) hits.push(o);
    if (hits.length >= 60) break;
  }
  hits.sort((a, b) => (b.p || 0) - (a.p || 0));
  return hits.slice(0, limit);
}

function scheduledNames() {
  return new Set(U.sched ? U.sched.blocks.map(b => b.name) : []);
}

/* one row in a search result: what it is, and whether it can actually be used */
function pickRow(o, act, extra) {
  const c = candFor(o.n);
  const up = c && c.w && c.w.total > 0;
  const taken = scheduledNames().has(o.n);
  const size = o.mj >= 60 ? (o.mj / 60).toFixed(1) + '°' : o.mj.toFixed(1) + '′';
  return `<li>
    <div class="nm" style="min-width:0">
      <b>${esc(label(o))}</b>
      <span class="meta"><span class="pill t-${o.t}">${esc(P.TYPES[o.t])}</span> ${size}${up ? ' · ' + Math.round(c.w.maxAlt) + '° peak · ' + dur(c.w.total / 60000) + ' up' : ' · not up tonight'}</span>
    </div>
    ${taken ? `<button class="btn sm ghost" disabled>In the plan</button>`
      : up ? `<button class="btn sm primary" ${extra || ''} data-act="${act}" data-n="${esc(o.n)}">Use</button>`
        : `<button class="btn sm ghost" data-act="pin" data-n="${esc(o.n)}">Pin for later</button>`}</li>`;
}

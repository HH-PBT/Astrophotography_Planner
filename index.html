/* ---------------- editing the plan in place ----------------
   Cycling a slot or filling a gap changes that one block and leaves the rest of
   the night alone.  Each edit is also recorded as a lock, so a later rebuild
   keeps it. */
function schedTotals() {
  const bl = U.sched.blocks;
  U.sched.total = bl.reduce((a, b) => a + (b.c ? b.c.total : 0), 0);
  U.sched.coverage = bl.reduce((a, b) => a + (b.e - b.s), 0) / (U.night.darkEnd - U.night.darkStart);
}
function lockAt(name, s, e) {
  U.pinned = U.pinned.filter(p => p.name !== name);
  U.pinned.push({ name, s, e, locked: true });
}
function roomForOneMore() {
  const st = S.st;
  if (U.sched && U.sched.blocks.length >= st.maxTargets) {
    st.maxTargets = U.sched.blocks.length + 1; S.save();
    return true;
  }
  return false;
}
function insertBlock(c, s, e) {
  const raised = roomForOneMore();
  U.sched.blocks.push({ name: c.o.n, s, e, c, pinned: true, locked: true });
  U.sched.blocks.sort((a, b) => a.s - b.s);
  lockAt(c.o.n, s, e);
  schedTotals(); U.gapPick = {}; HAP.firm(); render();
  return raised;
}
function replaceBlock(i, c) {
  const b = U.sched.blocks[i]; if (!b) return;
  U.pinned = U.pinned.filter(p => p.name !== b.name);
  b.name = c.o.n; b.c = c; b.pinned = true; b.locked = true;
  lockAt(c.o.n, b.s, b.e);
  schedTotals(); U.gapPick = {}; HAP.tap(); render();
}

/* Put a Quick pick into the plan at the window it suggested.  Anything it
   overlaps is shortened; a block left too short to be worth shooting is
   dropped, and you are told which. */
function quickAdd(c) {
  const st = S.st, s = c.fit.s, e = c.fit.e;
  if (!U.sched) {
    U.sched = { blocks: [], total: 0, coverage: 0 };
    U.sched.blocks.push({ name: c.o.n, s, e, c, pinned: true, locked: true });
    lockAt(c.o.n, s, e); schedTotals();
    U.view = 'schedule'; HAP.firm(); render();
    toast(c.o.n + ' is your first block — build around it or rebuild to fill the night');
    return;
  }
  if (scheduledNames().has(c.o.n)) { toast(c.o.n + ' is already in the plan'); U.view = 'schedule'; render(); return; }
  const gap = (st.gapMin || 0) * 60000, keepMin = Math.max(20, st.blockMin * 0.45) * 60000;
  const dropped = [], shortened = [];
  const kept = [];
  for (const b of U.sched.blocks) {
    if (b.e + gap <= s || b.s - gap >= e) { kept.push(b); continue; }
    /* overlaps: keep whichever side of it is still long enough */
    const left = (s - gap) - b.s, right = b.e - (e + gap);
    if (left >= keepMin && left >= right) { b.e = s - gap; shortened.push(b.name); kept.push(b); }
    else if (right >= keepMin) { b.s = e + gap; shortened.push(b.name); kept.push(b); }
    else { dropped.push(b.name); U.pinned = U.pinned.filter(p => p.name !== b.name); }
  }
  U.sched.blocks = kept;
  for (const b of kept) if (shortened.includes(b.name)) lockAt(b.name, b.s, b.e);
  if (U.sched.blocks.length >= st.maxTargets) { st.maxTargets = U.sched.blocks.length + 1; S.save(); }
  U.sched.blocks.push({ name: c.o.n, s, e, c, pinned: true, locked: true });
  U.sched.blocks.sort((a, b) => a.s - b.s);
  lockAt(c.o.n, s, e); schedTotals(); U.gapPick = {};
  U.view = 'schedule'; HAP.firm(); render();
  toast(c.o.n + ' added' + (shortened.length ? ' · shortened ' + shortened.join(', ') : '')
    + (dropped.length ? ' · dropped ' + dropped.join(', ') : ''));
}

/* ============================================================
   Quick pick — a time frame in, targets out.
   Same altitude limit, horizon, moon rules and rig framing as the
   planner, but nothing to set up: open it, check the times, and
   flick through what is actually up until something looks good.
   ============================================================ */

const QTYPES = {
  any: null,
  neb: ['emission', 'reflection', 'planetary', 'snr', 'dark', 'cluster_neb'],
  gal: ['galaxy', 'galaxy_group'],
  clu: ['open', 'globular', 'assoc'],
};
const QSORTS = [['best', 'Best fit'], ['big', 'Biggest'], ['bright', 'Brightest'], ['famous', 'Best known']];

/* everything visible, with the Setup shortlist filters lifted but the
   visibility rules — altitude, horizon, moon — still honoured */
function allCands() {
  if (!U.db || !U.night) return U.cands || [];
  if (U.allC && U.allCKey === U.date + '|' + S.st.rig + '|' + S.st.altLimit + '|' + S.st.useHorizon) return U.allC;
  const st = { ...S.st, types: Object.fromEntries(Object.keys(P.TYPES).map(t => [t, true])),
    sizeMin: 0, sizeMax: 1e9, cats: [], magLimit: null, popMin: 0, hideImaged: false };
  U.allC = P.candidates(U.db, st, U.night, S.horizon(), A.fov(S.rig()), { integ: S.integ, grid: U.grid });
  U.allCKey = U.date + '|' + S.st.rig + '|' + S.st.altLimit + '|' + S.st.useHorizon;
  return U.allC;
}

/* sensible opening window: from now if the night is already under way,
   otherwise from the start of darkness */
function quickDefaults() {
  const nt = U.night, st = S.st;
  const now = Date.now();
  let s = (now > nt.darkStart && now < nt.darkEnd) ? now : nt.darkStart;
  s = Math.ceil(s / 300000) * 300000;                          /* to the next 5 minutes */
  const e = Math.min(nt.darkEnd, s + Math.max(60, st.blockMax) * 60000);
  return { s, e };
}
function quickWindow() {
  const d = quickDefaults();
  const s = U.qFrom ? timeToMs(U.qFrom) : d.s;
  const e = U.qTo ? timeToMs(U.qTo) : d.e;
  if (s == null || e == null || e <= s) return d;
  return { s, e };
}

function quickList() {
  const st = S.st, w = quickWindow();
  const base = U.qAll ? allCands() : (U.cands || []);
  let list = P.alternatives(base, w.s, w.e, [], 0, st);
  const types = QTYPES[U.qType || 'any'];
  if (types) list = list.filter(c => types.includes(c.o.t));
  if (U.qHideImaged !== false) list = list.filter(c => integTotal(c.o.n) === 0);
  const sort = U.qSort || 'best';
  if (sort === 'big') list.sort((a, b) => b.o.mj - a.o.mj);
  else if (sort === 'bright') list.sort((a, b) => (a.o.v === '' ? 99 : a.o.v) - (b.o.v === '' ? 99 : b.o.v));
  else if (sort === 'famous') list.sort((a, b) => b.o.p - a.o.p);
  return list;
}

function viewQuick() {
  const st = S.st, nt = U.night;
  if (!nt) return `<div class="empty">Loading…</div>`;
  const w = quickWindow();
  const list = quickList();
  const idx = list.length ? ((U.qIdx || 0) % list.length + list.length) % list.length : 0;
  const c = list[idx];
  const f = A.fov(S.rig());
  const mins = (w.e - w.s) / 60000;

  /* the survey cutout, framed as your rig would see it — the fastest way to
     judge whether a target is worth the night */
  let hero = `<div class="empty">Nothing is up in that window with these restrictions.
    <div class="dim" style="margin-top:8px">Try a wider time frame, a lower altitude limit, or
    switch the filters off below.</div></div>`;
  if (c) {
    const o = c.o;
    const ctx = Math.max(f.w, f.h) * 1.6;
    const imgW = 520, imgH = Math.round(Math.min(360, Math.max(220, imgW * Math.max(f.h, .2) / Math.max(f.w, .2))));
    const url = skyUrl(o, ctx, imgW, imgH, st.rotation, st.survey);
    const boxW = (f.w / ctx) * 100, boxH = (f.h / (ctx * (imgH / imgW))) * 100;
    hero = `
    <div class="card">
      <div class="row spread">
        <div style="min-width:0">
          <h2 style="margin:0" data-act="obj" data-n="${esc(o.n)}">${esc(label(o))}</h2>
          <div class="meta"><span class="pill t-${o.t}">${esc(P.TYPES[o.t])}</span>
            ${o.mj >= 60 ? (o.mj / 60).toFixed(1) + '°' : o.mj.toFixed(1) + '′'}${o.v !== '' ? ' · mag ' + o.v : ''}
            ${integTotal(o.n) ? ' · ' + dur(integTotal(o.n)) + ' logged' : ''}${isDone(o.n) ? ' · finished for the season' : ''}</div>
        </div>
        <span class="sc" title="Match score out of 100">${Math.round(c.total)}</span>
      </div>
      <div class="fovbox" style="margin-top:10px">
        <img class="thumb" id="qimg" src="${esc(url)}" alt="Survey view of ${esc(o.n)}" style="aspect-ratio:${imgW}/${imgH}">
        <div class="frame" style="left:${(50 - boxW / 2).toFixed(1)}%;top:${(50 - boxH / 2).toFixed(1)}%;width:${boxW.toFixed(1)}%;height:${boxH.toFixed(1)}%"></div>
        <div class="cap">${Math.round(c.fr.fill * 100)}% of frame${c.fr.tilesNeeded > 1 ? ` · ${c.fr.tilesNeeded} panels` : ''}</div>
      </div>
      <div class="grid2" style="margin-top:10px">
        <div class="stat"><b>${esc(fmtTime(c.fit.s, st.tz))} – ${esc(fmtTime(c.fit.e, st.tz))}</b>best slice of your window</div>
        <div class="stat"><b>${Math.round(c.fit.meanAlt)}° / ${Math.round(c.w.maxAlt)}°</b>mean then peak altitude</div>
        <div class="stat"><b>${Math.round(c.msep)}°</b>from the moon</div>
        <div class="stat"><b>${dur(c.w.total / 60000)}</b>up and clear tonight</div>
      </div>
      <div class="why">${esc(whyText(c, { s: c.fit.s, e: c.fit.e }))}</div>
      <div class="btnrow" style="margin-top:10px">
        <button class="btn primary" data-act="qnext">↻ Next (${idx + 1}/${list.length})</button>
        <button class="btn" data-act="quse">${U.sched ? 'Add to the plan' : 'Start a plan with it'}</button>
        <button class="btn sm ghost" data-act="obj" data-n="${esc(o.n)}">Details</button>
      </div>
    </div>`;
  }

  const strip = list.slice(0, 24).map((x, k) => `<button class="qchip ${k === idx ? 'on' : ''}" data-act="qjump" data-i="${k}">
      ${esc(x.o.c || x.o.n)}<span class="dim"> ${Math.round(x.fitScore)}</span></button>`).join('');

  const gapList = U.sched ? P.gaps(nt, U.sched.blocks, st, 15) : [];

  return `
  <div class="card">
    <div class="grid2">
      <div class="field"><label class="f">From</label>
        <input type="time" value="${esc(fmtTime(w.s, st.tz))}" data-act="qtime" data-k="from"></div>
      <div class="field"><label class="f">To</label>
        <input type="time" value="${esc(fmtTime(w.e, st.tz))}" data-act="qtime" data-k="to"></div>
    </div>
    <div class="chips">
      <button class="chip" data-act="qpreset" data-k="now">From now</button>
      <button class="chip" data-act="qpreset" data-k="2h">Next 2h</button>
      <button class="chip" data-act="qpreset" data-k="rest">Rest of tonight</button>
      <button class="chip" data-act="qpreset" data-k="all">All darkness</button>
      ${gapList.slice(0, 3).map(g => `<button class="chip" data-act="qpreset" data-k="gap:${g.s}">
        Gap ${esc(fmtTime(g.s, st.tz))}</button>`).join('')}
    </div>
    <div class="chips" style="margin-top:6px">
      ${[['any', 'Anything'], ['neb', 'Nebulae'], ['gal', 'Galaxies'], ['clu', 'Clusters']]
      .map(([k, l]) => `<button class="chip" aria-pressed="${(U.qType || 'any') === k}" data-act="qtype" data-k="${k}">${l}</button>`).join('')}
    </div>
    <div class="dim" style="margin-top:8px">${dur(mins)} window · ${list.length} up and clear of your
      ${st.useHorizon && S.horizon() ? 'horizon' : st.altLimit + '° limit'}${U.qAll ? ' · filters off' : ''}</div>
  </div>

  ${hero}
  ${strip ? `<div class="card tight"><div class="qstrip">${strip}</div></div>` : ''}

  <details class="card">
    <summary>Order and filters — ${esc((QSORTS.find(x => x[0] === (U.qSort || 'best')) || [])[1] || '')}${U.qAll ? ', filters off' : ''}</summary>
    <div class="chips" style="margin-top:10px">
      ${QSORTS.map(([k, l]) => `<button class="chip" aria-pressed="${(U.qSort || 'best') === k}" data-act="qsort" data-k="${k}">${l}</button>`).join('')}
      <button class="chip" data-act="qshuffle">Surprise me</button>
    </div>
    <div class="chips" style="margin-top:6px">
      <button class="chip" aria-pressed="${!!U.qAll}" data-act="qall">Ignore my Setup filters</button>
      <button class="chip" aria-pressed="${U.qHideImaged !== false}" data-act="qimaged">Hide what I've started</button>
    </div>
    <div class="dim" style="margin-top:8px">Altitude limit, horizon, moon clearance and rig framing always come from
      Setup — only the size, type, magnitude and catalogue filters are lifted here.</div>
  </details>`;
}

/* ============================================================
   Two long-game features:

   Integration time — how many minutes are actually stacked on each
   target, across every night, rather than a single imaged tick.

   Season view — which showpieces are coming into their prime over
   the next twelve months, so a year's imaging can be looked
   forward to rather than improvised.
   ============================================================ */

/* ---------------- integration time ---------------- */
function integ(name) { return S.integ[name] || { total: 0, sessions: [] }; }
function integTotal(name) { return integ(name).total || 0; }
function integGoal() { return Math.max(30, S.st.integGoal || 240); }

function logTime(name, mins, date) {
  mins = Math.round(+mins);
  if (!name || !mins) return;
  const rec = S.integ[name] || { total: 0, sessions: [] };
  rec.sessions = rec.sessions || [];
  rec.sessions.push({ d: date || dateInput(Date.now(), S.st.tz), m: mins });
  rec.total = rec.sessions.reduce((a, x) => a + x.m, 0);
  if (rec.total <= 0) delete S.integ[name]; else S.integ[name] = rec;
  /* any time on a target means it has been imaged */
  S.save();
}
function dropSession(name, i) {
  const rec = S.integ[name]; if (!rec) return;
  rec.sessions.splice(i, 1);
  rec.total = rec.sessions.reduce((a, x) => a + x.m, 0);
  if (!rec.sessions.length) delete S.integ[name];
  S.save();
}
function integBar(name) {
  const t = integTotal(name), g = integGoal();
  if (!t) return '';
  const pct = Math.min(100, t / g * 100);
  return `<div class="progwrap"><div class="progbar"><i style="width:${pct.toFixed(0)}%"></i></div>
    <span class="dim">${dur(t)} of ${dur(g)}${t >= g ? ' · done' : ''}</span></div>`;
}

/* the block of controls that appears on a target's page */
function integPanel(name) {
  const rec = integ(name), g = integGoal();
  const sess = (rec.sessions || []).slice().reverse();
  return `
  <div class="row spread" style="margin-top:14px"><h3>Time on target</h3>
    <span class="dim">${rec.total ? dur(rec.total) + ' of ' + dur(g) : 'nothing logged yet'}</span></div>
  ${rec.total ? integBar(name) : ''}
  <div class="chips" style="margin-top:8px">
    ${[15, 30, 60, 90, 120].map(m => `<button class="chip" data-act="logtime" data-n="${esc(name)}" data-k="${m}">+${m >= 60 ? (m / 60) + 'h' : m + 'm'}</button>`).join('')}
    <button class="chip" data-act="logask" data-n="${esc(name)}">Other…</button>
  </div>
  ${sess.length ? `<ul class="list sess">${sess.map((x, k) => `<li>
      <span class="dim">${esc(x.d)}</span><b>${dur(x.m)}</b>
      <button class="btn sm ghost" data-act="dropsess" data-n="${esc(name)}" data-i="${rec.sessions.length - 1 - k}">×</button></li>`).join('')}</ul>` : ''}
  <div class="dim">Logged time feeds the planner: a target you have started but not finished scores
    higher than a fresh one, until it reaches the goal in Setup.</div>`;
}

/* ---------------- season view ----------------
   For each of the next twelve months, how long every object clears your
   altitude limit inside that month's astronomical darkness, and how high it
   gets while it does.  Worked out from hour angles, so the whole catalogue
   across a year costs a few milliseconds. */
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December'];

function seasonMonths() {
  const st = S.st, out = [];
  const now = new Date();
  for (let k = 0; k < 12; k++) {
    const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + k, 15, 12));
    const key = d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-15';
    const noon = localNoon(key, st.tz);
    out.push({ m: d.getUTCMonth(), y: d.getUTCFullYear(), key, noon, offset: k,
      nt: A.night(noon, st.lat, st.lon, st.twilight) });
  }
  return out;
}

function seasonData() {
  const st = S.st;
  const key = [U.date, st.lat, st.lon, st.altLimit, st.twilight, st.rig, st.tiles].join('|');
  if (U.seasonKey === key && U.season) return U.season;
  const months = seasonMonths();
  const f = A.fov(S.rig());
  const rows = [];
  for (const o0 of DB) {
    const o = objFor(o0);
    if (A.transitAlt(st.lat, o.d) < st.altLimit) continue;
    const fr = P.framing(o, f);
    const per = months.map(mo => A.seasonFit(st.lat, st.lon, o.ra, o.d, st.altLimit, mo.nt));
    let bi = 0;
    for (let i = 1; i < per.length; i++) if (per[i].hours > per[bi].hours + 0.15) bi = i;
    rows.push({ o, fr, per, best: bi });
  }
  U.season = { months, rows };
  U.seasonKey = key;
  return U.season;
}

function seasonScore(r, i) {
  const fit = r.per[i];
  if (!fit.hours) return 0;
  const hrs = Math.min(1, fit.hours / 5);
  const alt = Math.max(0, Math.min(1, (fit.peak - S.st.altLimit) / (70 - S.st.altLimit)));
  return r.o.p * 0.5 + r.fr.score * 26 + hrs * 26 + alt * 18;
}

function seasonList(i) {
  const d = seasonData();
  const only = U.seasonOnly || 'all';
  let rows = d.rows.filter(r => r.per[i].hours >= 1);
  if (only === 'messier') rows = rows.filter(r => r.o.m);
  else if (only === 'todo') rows = rows.filter(r => integTotal(r.o.n) === 0 && !isDone(r.o.n) && (r.o.p >= 45 || r.o.m));
  else if (only === 'unfinished') rows = rows.filter(r => integTotal(r.o.n) > 0 && integTotal(r.o.n) < integGoal());
  else rows = rows.filter(r => r.o.p >= 35 || r.o.m);
  rows.forEach(r => { r.sc = seasonScore(r, i); });
  rows.sort((a, b) => b.sc - a.sc);
  return rows;
}

function viewSeason() {
  const st = S.st, d = seasonData();
  const i = U.seasonMonth || 0;
  const mo = d.months[i];
  const rows = seasonList(i);
  const doneM = [...shotNames()].filter(n => (byName(n) || {}).m).length;
  const totalTime = Object.values(S.integ).reduce((a, x) => a + (x.total || 0), 0);

  const strip = d.months.map((m, k) => `<button class="qchip ${k === i ? 'on' : ''}" data-act="smonth" data-i="${k}">
      ${esc(MONTHS[m.m].slice(0, 3))}${m.offset === 0 ? ' ·' : ''}</button>`).join('');

  return `
  <div class="card">
    <div class="row spread"><h3>${esc(MONTHS[mo.m])} ${mo.y}</h3>
      <span class="dim">${mo.offset === 0 ? 'this month' : mo.offset === 1 ? 'next month' : 'in ' + mo.offset + ' months'}</span></div>
    <div class="dim" style="margin-top:4px">${dur((mo.nt.darkEnd - mo.nt.darkStart) / 60000)} of darkness mid-month,
      ${esc(fmtTime(mo.nt.darkStart, st.tz))} – ${esc(fmtTime(mo.nt.darkEnd, st.tz))}.
      Above ${st.altLimit}° while dark, from ${esc(st.place || 'your site')}.</div>
    <div class="qstrip" style="margin-top:10px">${strip}</div>
  </div>

  <div class="card tight">
    <div class="chips">
      ${[['all', 'Showpieces'], ['messier', 'Messier'], ['todo', 'Not yet shot'], ['unfinished', 'Needs more time']]
      .map(([k, l]) => `<button class="chip" aria-pressed="${(U.seasonOnly || 'all') === k}" data-act="sonly" data-k="${k}">${l}</button>`).join('')}
    </div>
    <div class="dim" style="margin-top:8px">Messier ${doneM}/110${totalTime ? ' · ' + dur(totalTime) + ' stacked in total' : ''}</div>
    ${(U.seasonOnly === 'messier') ? messierReach() : ''}
  </div>

  ${comingUp(i)}

  ${rows.length ? `<div class="card"><ul class="list">${rows.slice(0, 40).map(r => {
    const fit = r.per[i], t = integTotal(r.o.n), prime = r.best === i;
    return `<li class="srow" data-act="obj" data-n="${esc(r.o.n)}">
      <div class="nm" style="min-width:0">
        <b>${isDone(r.o.n) ? '✓ ' : integTotal(r.o.n) ? '◑ ' : ''}${esc(label(r.o))}</b>
        <span class="meta"><span class="pill t-${r.o.t}">${esc(P.TYPES[r.o.t])}</span>
          ${fit.hours.toFixed(1)}h up · ${Math.round(fit.peak)}° peak · ${Math.round(r.fr.fill * 100)}% of frame${t ? ' · ' + dur(t) + ' done' : ''}</span>
      </div>
      ${prime ? `<span class="prime">prime</span>` : `<span class="dim sm">${esc(MONTHS[d.months[r.best].m].slice(0, 3))}</span>`}</li>`;
  }).join('')}</ul></div>`
      : `<div class="empty">Nothing matches that filter this month.</div>`}

  <div class="card tight"><span class="dim">“Prime” means this is the month the object spends longest in
    darkness above your limit. It uses your altitude limit rather than the panorama horizon, since a
    year of tree lines is more than a planner can promise.</span></div>`;
}

/* one line on a target's page: when it is at its best from here */
function primeLine(name) {
  const d = seasonData();
  const r = d.rows.find(x => x.o.n === name);
  if (!r) return '';
  const b = d.months[r.best], fit = r.per[r.best], now = r.per[0];
  const same = r.best === 0;
  return `<div class="dim" style="margin-top:10px">Best from here in
    <b>${esc(MONTHS[b.m])}</b>${same ? ' — that is now' : ''}: ${fit.hours.toFixed(1)}h above
    ${S.st.altLimit}° while dark, peaking ${Math.round(fit.peak)}°.${same ? ''
      : ` This month it manages ${now.hours ? now.hours.toFixed(1) + 'h' : 'nothing'}.`}</div>`;
}

/* An honest note for the Messier goal: some of it is simply too far north to be
   had from this latitude, and a few more never get properly clear of the murk. */
function messierReach() {
  const st = S.st;
  const ms = DB.filter(o => o.m);
  const never = ms.filter(o => A.transitAlt(st.lat, o.d) <= 0);
  const low = ms.filter(o => { const a = A.transitAlt(st.lat, o.d); return a > 0 && a < 20; });
  const under = ms.filter(o => { const a = A.transitAlt(st.lat, o.d); return a >= 20 && a < st.altLimit; });
  const name = o => o.n.replace('M ', 'M');
  return `<div class="dim" style="margin-top:6px">From ${st.lat.toFixed(1)}°:
    ${never.length ? `<b>${never.length}</b> never rise (${never.map(name).join(', ')}).` : 'all 110 rise.'}
    ${low.length ? ` <b>${low.length}</b> only ever reach under 20° (${low.map(name).join(', ')}) — possible on a clear
      northern horizon, but hard.` : ''}
    ${under.length ? ` ${under.length} more peak below your ${st.altLimit}° limit, so they are hidden here until you
      lower it.` : ''}</div>`;
}

/* What is about to come good: the objects whose prime month falls in each of the
   next three months, so the year has something to look forward to in it. */
function comingUp(from) {
  const d = seasonData();
  const out = [];
  for (let k = 1; k <= 3; k++) {
    const i = (from + k) % 12;
    if (from + k > 11) break;
    const mo = d.months[from + k];
    let picks = d.rows.filter(r => r.best === from + k && r.per[from + k].hours >= 2 && (r.o.p >= 55 || r.o.m));
    if (U.seasonOnly === 'todo' || U.seasonOnly === 'messier') {
      const f = picks.filter(r => !isDone(r.o.n) && (U.seasonOnly !== 'messier' || r.o.m));
      if (f.length) picks = f;
    }
    picks.sort((a, b) => seasonScore(b, from + k) - seasonScore(a, from + k));
    if (!picks.length) continue;
    out.push(`<div class="cu"><span class="cum">${esc(MONTHS[mo.m].slice(0, 3))}</span>
      <span class="cul">${picks.slice(0, 4).map(r => `<b data-act="obj" data-n="${esc(r.o.n)}">${esc(r.o.c || r.o.n)}</b>`).join('<span class="dim"> · </span>')}</span></div>`);
  }
  if (!out.length) return '';
  return `<div class="card"><h3>Coming into their prime</h3>
    <div style="margin-top:8px">${out.join('')}</div>
    <div class="dim" style="margin-top:8px">Each object listed under the month it spends longest in the dark.</div></div>`;
}

/* ============================================================
   Shell behaviour — the things that make it feel like an app
   rather than a page: haptics, swipe between tabs, sheets you
   can throw away with a thumb, the Android back button, and
   a windowed target list so 1,350 rows never all exist at once.
   ============================================================ */

const TABS = ['tonight', 'schedule', 'quick', 'targets', 'gallery', 'horizon', 'setup'];

/* ---------------- haptics ---------------- */
const HAP = {
  last: 0,
  on() { return S.st && S.st.haptics !== false && typeof navigator.vibrate === 'function'; },
  buzz(ms) { if (!this.on()) return; try { navigator.vibrate(ms); } catch (e) { } },
  tap() { this.buzz(9); },
  firm() { this.buzz(18); },
  /* sliders fire continuously, so a tick is rate limited to stay a texture rather than a rattle */
  tick() {
    const t = Date.now();
    if (t - this.last < 45) return;
    this.last = t; this.buzz(4);
  },
};

/* ---------------- moving between tabs ---------------- */
function goTab(v, dir) {
  if (v === U.view || !TABS.includes(v)) return;
  U.view = v;
  const host = $('#view');
  if (host && dir) {
    host.classList.remove('slide-l', 'slide-r');
    void host.offsetWidth;                     /* restart the animation */
    host.classList.add(dir > 0 ? 'slide-l' : 'slide-r');
  }
  window.scrollTo(0, 0);
  render();
  HAP.tap();
}

/* a horizontal drag across the body moves one tab; vertical scrolling is untouched */
function initSwipe() {
  let x0 = 0, y0 = 0, t0 = 0, live = false;
  const blocked = el => !el || !el.closest ||
    !!el.closest('input[type=range], canvas, .sheet, .cmpwrap, .pgrid, .chips, [data-noswipe]');

  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1 || $('#sheet') || blocked(e.target)) { live = false; return; }
    const t = e.touches[0];
    x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); live = true;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!live) return;
    live = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
    if (dt > 700 || Math.abs(dx) < 64 || Math.abs(dx) < Math.abs(dy) * 1.7) return;
    const i = TABS.indexOf(U.view);
    const j = dx < 0 ? i + 1 : i - 1;
    if (j < 0 || j >= TABS.length) return;
    goTab(TABS[j], dx < 0 ? 1 : -1);
  }, { passive: true });
}

/* ---------------- sheets: drag down to dismiss ---------------- */
function initSheetDrag(bg) {
  const card = bg.querySelector('.sheet');
  if (!card) return;
  let y0 = 0, dy = 0, dragging = false, id = null;

  const start = e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    /* only when the sheet is scrolled to the top, or the grab began on the handle */
    const onGrip = !!(e.target.closest && e.target.closest('.handle, .grip'));
    if (!onGrip && card.scrollTop > 2) return;
    if (e.target.closest && e.target.closest('input, textarea, select, button, a, .ptile')) {
      if (!onGrip) return;
    }
    dragging = true; y0 = e.clientY; dy = 0; id = e.pointerId;
    card.style.transition = 'none';
  };
  const move = e => {
    if (!dragging || e.pointerId !== id) return;
    dy = e.clientY - y0;
    if (dy < 0) { dy = dy / 4; }                      /* upward resists */
    if (dy > 6 && card.setPointerCapture) { try { card.setPointerCapture(id); } catch (err) { } }
    card.style.transform = 'translateY(' + dy.toFixed(1) + 'px)';
    bg.style.background = 'rgba(3,5,9,' + Math.max(0.2, 0.72 - dy / 900).toFixed(3) + ')';
  };
  const end = () => {
    if (!dragging) return;
    dragging = false;
    card.style.transition = 'transform .22s ease-out';
    if (dy > 110) { HAP.tap(); closeSheet(); return; }
    card.style.transform = '';
    bg.style.background = '';
  };
  card.addEventListener('pointerdown', start);
  card.addEventListener('pointermove', move);
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

/* ---------------- Android back button closes the sheet ---------------- */
function initBack() {
  window.addEventListener('popstate', () => {
    if ($('#sheet')) { U.sheetHist = false; removeSheet(); }
  });
}

/* ---------------- windowed target list ---------------- */
const TROW = 64;                                  /* fixed row height, so the maths is exact */
const TPAD = 6;                                   /* rows kept above and below the viewport */

function tvWindow() {
  const host = $('#trows');
  const n = (U.tlist || []).length;
  if (!host || !n) return { s: 0, e: 0 };
  const top = host.getBoundingClientRect().top + window.scrollY;
  const first = Math.floor((window.scrollY - top) / TROW) - TPAD;
  const count = Math.ceil(window.innerHeight / TROW) + TPAD * 2;
  const s = Math.max(0, Math.min(n - 1, first));
  return { s, e: Math.min(n, s + count) };
}

function paintRows(force) {
  if (U.view !== 'targets') return;
  const host = $('#trows'); if (!host) return;
  const w = tvWindow();
  if (!force && w.s === U.tvs && w.e === U.tve) return;
  U.tvs = w.s; U.tve = w.e;
  paint(host, targetRows(w.s, w.e));
}

let tvQueued = false;
function onScrollTargets() {
  if (U.view !== 'targets' || tvQueued) return;
  tvQueued = true;
  requestAnimationFrame(() => { tvQueued = false; paintRows(false); });
}

/* ---------------- service worker, when served over http ---------------- */
function initUpdates() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = w => {
      if (!w) return;
      U.update = w;
      toast('A new version is ready — tap Update in Setup');
      render();
    };
    if (reg.waiting) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
  }).catch(() => { /* not served over http, or the browser refused — the app still runs */ });

  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return; reloading = true; location.reload();
  });
}

/* ============================================================
   Actions
   ============================================================ */
const NUMK = new Set(['lat', 'lon', 'bortle', 'altLimit', 'minTargets', 'maxTargets', 'blockMin', 'blockMax', 'integGoal',
  'gapMin', 'moonSepBase', 'sizeMin', 'sizeMax', 'popMin', 'cloudLimit', 'rotation', 'tiles', 'subLen']);
const BOOLK = new Set(['haptics', 'favourStarted', 'moonSepEnable', 'hideImaged', 'narrowband', 'useHorizon']);
let reTimer = null;
function later(fn, ms = 320) { clearTimeout(reTimer); reTimer = setTimeout(fn, ms); }
function download(name, text, type = 'text/plain') {
  const b = new Blob([text], { type }), u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
function timeToMs(str) {
  if (!str) return null;
  const [h, m] = str.split(':').map(Number);
  const noon = localNoon(U.date, S.st.tz);
  return noon + (((h * 60 + m) - 720 + 1440) % 1440) * 60000;
}

async function act(a, el, ev) {
  const st = S.st, n = el && el.dataset.n, i = el && +el.dataset.i, k = el && el.dataset.k;
  switch (a) {
    case 'tab': {
      const i = TABS.indexOf(U.view), j = TABS.indexOf(el.dataset.v);
      goTab(el.dataset.v, j > i ? 1 : -1); return;
    }
    case 'update': {
      if (U.update) { try { U.update.postMessage({ type: 'SKIP_WAITING' }); } catch (e) { location.reload(); } }
      else location.reload();
      return;
    }
    case 'day': {
      const noon = localNoon(U.date, st.tz) + (+el.dataset.n) * 86400000;
      U.date = dateInput(noon, st.tz); U.pinned = []; U.gapPick = {}; await recompute(); return;
    }
    case 'today': U.date = todayStr(); U.pinned = []; U.gapPick = {}; await recompute(); return;
    case 'build': HAP.firm(); U.view = 'schedule'; U.interactive = null; buildSchedule('rebuild'); return;
    case 'shuffle': HAP.firm(); buildSchedule('mix'); return;
    case 'interactive':
      U.view = 'schedule'; U.sched = null;
      U.interactive = { blocks: [], cursor: U.night.darkStart, n: 5 }; render(); return;
    case 'ivn': U.interactive.n = +el.dataset.n; render(); return;
    case 'ivskip': U.interactive.cursor += 30 * 60000; render(); return;
    case 'ivpick': {
      const iv = U.interactive, gap = (st.gapMin || 0) * 60000;
      const avail = Math.min(st.blockMax * 60000, U.night.darkEnd - iv.cursor);
      const opts = P.alternatives(U.cands, iv.cursor, iv.cursor + avail,
        iv.blocks.map(b => b.name), iv.n || 5, st);
      const p = opts[i]; if (!p) { toast('That option has gone — pick another'); render(); return; }
      iv.blocks.push({ name: p.o.n, s: p.fit.s, e: p.fit.e, c: p });
      iv.cursor = p.fit.e + gap; HAP.tap(); render(); return;
    }
    case 'ivdone': {
      const bl = U.interactive.blocks;
      U.sched = { blocks: bl, total: 0, coverage: bl.reduce((x, b) => x + (b.e - b.s), 0) / (U.night.darkEnd - U.night.darkStart) };
      U.interactive = null; render(); return;
    }
    case 'obj': objectSheet(n); return;
    case 'closesheet': closeSheet(); return;
    case 'swap': U.swapq = ''; closeSheet(); swapSheet(i); return;
    case 'doswap': {
      const b = U.sched.blocks[i], c = candFor(n);
      if (!c) { toast(n + ' is not up tonight'); return; }
      const dup = U.sched.blocks.find((x, k) => k !== i && x.name === n);
      if (dup) { toast(n + ' is already in the plan at ' + fmtTime(dup.s, st.tz)); return; }
      /* keep the slot, take the best window this target can manage inside it */
      const alt = P.alternatives([c], b.s, b.e, [], 1, st);
      if (alt.length) { b.s = alt[0].fit.s; b.e = alt[0].fit.e; }
      closeSheet(); U.swapq = ''; replaceBlock(i, c);
      toast(n + ' is in that slot' + (alt.length && (alt[0].fit.frac < 0.95) ? ' — it only covers ' + Math.round(alt[0].fit.frac * 100) + '% of it' : ''));
      return;
    }
    case 'retime': closeSheet(); retimeSheet(i); return;
    case 'doretime': {
      const b = U.sched.blocks[i];
      const s = timeToMs($('#rt-s').value), e = timeToMs($('#rt-e').value);
      if (s == null || e == null || e <= s) { toast('End time must come after the start'); return; }
      U.pinned = U.pinned.filter(p => p.name !== b.name);
      U.pinned.push({ name: b.name, s, e, locked: true });
      closeSheet();
      if (el.dataset.keep) { b.s = s; b.e = e; U.sched.blocks.sort((x, y) => x.s - y.s); render(); }
      else buildSchedule(false);
      return;
    }
    case 'lock': {
      const b = U.sched.blocks[i];
      const was = U.pinned.find(p => p.name === b.name);
      if (was) U.pinned = U.pinned.filter(p => p.name !== b.name);
      else U.pinned.push({ name: b.name, s: b.s, e: b.e, locked: true });
      render(); return;
    }
    case 'drop': {
      const b = U.sched.blocks[i];
      const was = { pinned: U.pinned.slice(), banned: S.banned[b.name], blocks: U.sched.blocks.slice() };
      U.pinned = U.pinned.filter(p => p.name !== b.name);
      S.banned[b.name] = { session: U.date };
      U.sched.blocks.splice(i, 1);
      await recompute(true); buildSchedule(false);
      toast(b.name + ' removed and set aside', async () => {
        U.pinned = was.pinned;
        if (was.banned) S.banned[b.name] = was.banned; else delete S.banned[b.name];
        S.save(); await recompute(true);
        U.sched.blocks = was.blocks; schedTotals(); render();
      });
      return;
    }
    /* ↻ Another: keep the window, take the next best target for it */
    case 'cycle': {
      const b = U.sched.blocks[i]; if (!b) return;
      const others = U.sched.blocks.filter((x, k) => k !== i).map(x => x.name);
      const opts = P.alternatives(U.cands, b.s, b.e, others, 12, st);
      if (!opts.length) { toast('Nothing else fits that window'); return; }
      U.cyc = U.cyc || {};
      const key = b.s + '|' + b.e;
      const cur = opts.findIndex(o => o.o.n === b.name);
      const next = opts[((U.cyc[key] != null ? U.cyc[key] : cur) + 1) % opts.length];
      U.cyc[key] = opts.indexOf(next);
      replaceBlock(i, next);
      toast(next.o.n + ' — ' + (U.cyc[key] + 1) + ' of ' + opts.length + ' that fit this slot');
      return;
    }
    /* gap cards */
    case 'gapnext': {
      U.gapPick[el.dataset.k] = (U.gapPick[el.dataset.k] || 0) + 1;
      HAP.tap(); render(); return;
    }
    case 'gapuse': {
      const g = (U.gapIndex || {})[el.dataset.k]; if (!g) return;
      const opts = gapSuggestions(g);
      const pick = opts[(U.gapPick[el.dataset.k] || 0) % Math.max(1, opts.length)];
      if (!pick) return;
      const raised = insertBlock(pick, pick.fit.s, pick.fit.e);
      toast(pick.o.n + ' added' + (raised ? ' — target limit raised to ' + st.maxTargets : '')); return;
    }
    case 'gapfind': { U.addq = ''; addSheet(el.dataset.k); return; }
    case 'gapquick': {
      const g = (U.gapIndex || {})[el.dataset.k]; if (!g) return;
      U.qFrom = fmtTime(g.s, st.tz); U.qTo = fmtTime(g.e, st.tz); U.qIdx = 0;
      goTab('quick', 1); return;
    }
    case 'addtarget': { U.addq = ''; addSheet(null); return; }
    case 'addq': { U.addq = el.value; addSheet(el.dataset.k || null); return; }
    case 'gappick': {
      const g = (U.gapIndex || {})[el.dataset.k]; if (!g) return;
      const c = candFor(n); if (!c) { toast(n + ' is not up tonight'); return; }
      if (scheduledNames().has(n)) { toast(n + ' is already in the plan'); return; }
      const alt = P.alternatives([c], g.s, g.e, [], 1, st);
      if (!alt.length) { toast(n + ' does not reach that window'); return; }
      closeSheet();
      const raised2 = insertBlock(alt[0], alt[0].fit.s, alt[0].fit.e);
      toast(n + ' added' + (raised2 ? ' — target limit raised to ' + st.maxTargets : '')); return;
    }
    case 'addpick': {
      const c = candFor(n); if (!c) { toast(n + ' is not up tonight'); return; }
      if (scheduledNames().has(n)) { toast(n + ' is already in the plan'); return; }
      const blocks = U.sched ? U.sched.blocks : [];
      const room = P.makeRoom(U.night, blocks, st, n, [c]);
      if (!room) { toast('No room for ' + n + ' — shorten a block or raise the target count'); return; }
      if (room.trimmed) {
        const t = blocks.find(b => b.name === room.trimmed.name);
        if (t) { t.e = room.trimmed.e; lockAt(t.name, t.s, t.e); }
      }
      closeSheet();
      const raised3 = insertBlock(c, room.fit.s, room.fit.e);
      toast(n + ' added' + (room.trimmed ? ', ' + room.trimmed.name + ' shortened to fit' : '')
        + (raised3 ? ' — target limit raised to ' + st.maxTargets : ''));
      return;
    }
    case 'swapq': { U.swapq = el.value; swapSheet(+el.dataset.i); return; }
    /* ---------- quick pick ---------- */
    case 'qtime': {
      const v = el.value; if (!v) return;
      const w0 = quickWindow(), span = w0.e - w0.s;
      let s0 = w0.s, e0 = w0.e;
      const t = timeToMs(v); if (t == null) return;
      if (k === 'from') { s0 = t; if (e0 <= s0) e0 = Math.min(U.night.darkEnd, s0 + span); }
      else { e0 = t; if (e0 <= s0) s0 = Math.max(U.night.darkStart, e0 - span); }
      if (e0 <= s0) e0 = s0 + 30 * 60000;
      U.qFrom = fmtTime(s0, st.tz); U.qTo = fmtTime(e0, st.tz);
      U.qIdx = 0; render(); return;
    }
    case 'qpreset': {
      const nt = U.night, now = Date.now();
      let s0, e0;
      if (k === 'now') { s0 = (now > nt.darkStart && now < nt.darkEnd) ? now : nt.darkStart; e0 = Math.min(nt.darkEnd, s0 + Math.max(60, st.blockMax) * 60000); }
      else if (k === '2h') { s0 = (now > nt.darkStart && now < nt.darkEnd) ? now : nt.darkStart; e0 = Math.min(nt.darkEnd, s0 + 120 * 60000); }
      else if (k === 'rest') { s0 = (now > nt.darkStart && now < nt.darkEnd) ? now : nt.darkStart; e0 = nt.darkEnd; }
      else if (k === 'all') { s0 = nt.darkStart; e0 = nt.darkEnd; }
      else if (k.startsWith('gap:')) {
        const g = P.gaps(nt, U.sched ? U.sched.blocks : [], st, 15).find(x => String(x.s) === k.slice(4));
        if (!g) return; s0 = g.s; e0 = g.e;
      }
      s0 = Math.ceil(s0 / 300000) * 300000;
      U.qFrom = fmtTime(s0, st.tz); U.qTo = fmtTime(e0, st.tz); U.qIdx = 0;
      HAP.tap(); render(); return;
    }
    case 'qnext': { U.qIdx = (U.qIdx || 0) + 1; HAP.tap(); render(); return; }
    case 'qjump': { U.qIdx = i; HAP.tap(); render(); return; }
    case 'qtype': { U.qType = k; U.qIdx = 0; render(); return; }
    case 'qsort': { U.qSort = k; U.qIdx = 0; render(); return; }
    case 'qshuffle': {
      const n2 = quickList().length;
      U.qIdx = n2 ? Math.floor(Math.random() * Math.min(n2, 30)) : 0;
      HAP.firm(); render(); return;
    }
    case 'qall': { U.qAll = !U.qAll; U.qIdx = 0; render(); return; }
    case 'qimaged': { U.qHideImaged = U.qHideImaged === false; U.qIdx = 0; render(); return; }
    case 'quse': {
      const list = quickList();
      const pick = list[((U.qIdx || 0) % Math.max(1, list.length) + list.length) % Math.max(1, list.length)];
      if (!pick) return;
      quickAdd(pick); return;
    }
    /* ---------- integration time ---------- */
    case 'logmore': { objectSheet(n); return; }
    case 'logtime': { logTime(n, +k); HAP.firm(); await recompute(true, true, true); if ($('#sheet')) objectSheet(n); return; }
    case 'logask': {
      const v = prompt('Minutes on ' + n + ' (a negative number takes time off)');
      if (v == null || !+v) return;
      logTime(n, +v); await recompute(true, true, true); if ($('#sheet')) objectSheet(n); return;
    }
    case 'dropsess': {
      const rec = S.integ[n], gone = rec && rec.sessions[i];
      dropSession(n, i); await recompute(true, true, true); if ($('#sheet')) objectSheet(n);
      if (gone) toast(dur(gone.m) + ' removed from ' + n, async () => {
        logTime(n, gone.m, gone.d); await recompute(true, true, true); if ($('#sheet')) objectSheet(n);
      });
      return;
    }
    /* ---------- season view ---------- */
    case 'tmode': { U.tmode = k === 'season' ? 'season' : 'cat'; window.scrollTo(0, 0); render(); return; }
    case 'confirmsetup': { st.confirmed = true; S.save(); HAP.tap(); render(); return; }
    case 'season': { U.tmode = 'season'; U.seasonMonth = 0; goTab('targets', 1); return; }
    case 'smonth': { U.seasonMonth = i; HAP.tap(); render(); return; }
    case 'sonly': { U.seasonOnly = k; render(); return; }
    case 'clearpins': {
      const was = { pinned: U.pinned.slice(), pins: { ...S.pins } };
      U.pinned = []; S.pins = {}; S.save(); buildSchedule(false);
      toast('Kept targets cleared', () => {
        U.pinned = was.pinned; S.pins = was.pins; S.save(); buildSchedule(false);
      });
      return;
    }
    /* Two separate decisions: how much time is on a target, and whether you are
       done with it for this apparition. */
    case 'logblock': {
      HAP.firm();
      const mins = Math.round(+el.dataset.mins || 0);
      if (!mins) return;
      logTime(n, mins);
      closeSheet(); await recompute(true, true, true);
      toast('+' + dur(mins) + ' on ' + n + ' — ' + dur(integTotal(n)) + ' in total', async () => {
        const rec = S.integ[n];
        if (rec && rec.sessions.length) dropSession(n, rec.sessions.length - 1);
        await recompute(true, true, true);
      });
      return;
    }
    case 'seasondone': {
      HAP.firm();
      const had = isDone(n);
      if (had) delete S.done[n];
      else S.done[n] = { at: Date.now(), date: dateInput(Date.now(), st.tz) };
      S.save(); closeSheet(); await recompute(true);
      if (U.sched) buildSchedule(false);
      toast(had ? n + ' is back in the pool' : n + ' put away for the season', async () => {
        if (had) S.done[n] = { at: Date.now(), date: dateInput(Date.now(), st.tz) }; else delete S.done[n];
        S.save(); await recompute(true); if (U.sched) buildSchedule(false);
      });
      return;
    }
    case 'imaged': {
      /* older buttons and the gallery still call this: treat it as time logged */
      const mins = el.dataset.mins ? Math.round(+el.dataset.mins) : 0;
      if (mins) { logTime(n, mins); await recompute(true, true); toast(n + ' — ' + dur(integTotal(n)) + ' logged'); return; }
      const had = S.imaged[n];
      if (had) delete S.imaged[n]; else S.imaged[n] = { date: dateInput(Date.now(), st.tz) };
      S.save(); closeSheet(); await recompute(true); return;
    }
    case 'unimage': delete S.imaged[n]; delete S.done[n]; S.save(); await recompute(true); return;
    case 'pin': {
      /* a pin is a standing instruction, not a one-off: it is saved and survives
         rebuilds, setting changes and moving to another night */
      if (isPinned(n)) { delete S.pins[n]; U.pinned = U.pinned.filter(p => p.name !== n); }
      else {
        S.pins[n] = 1;
        if (!U.cands.find(x => x.o.n === n)) toast(n + ' is pinned, but is not up tonight');
      }
      S.save(); HAP.firm();
      closeSheet(); if (U.sched) buildSchedule(false); else render(); return;
    }
    case 'ban': {
      if (S.banned[n]) delete S.banned[n]; else S.banned[n] = { at: Date.now() };
      S.save(); closeSheet(); await recompute(true); return;
    }
    case 'photo': {
      const o = byName(n);
      toast('Looking for a photo…');
      const p = await findPhoto(o);
      if (!p) { toast('No photo found — try AstroBin'); return; }
      openSheet(`<div class="row spread"><h2>${esc(o.c || o.n)}</h2><button class="btn sm ghost" data-act="closesheet">Close</button></div>
        <img class="thumb" style="aspect-ratio:auto;margin-top:10px" src="${esc(p.url)}" alt="${esc(p.title)}">
        <div class="dim" style="margin-top:6px">${esc(p.title)} — ${esc(p.credit)}</div>`);
      return;
    }
    case 'wx': await WX.load(st.lat, st.lon, true); render(); return;
    case 'export': exportSheet(); return;
    case 'copyexp': {
      const t = $('#exptext').value;
      try { await navigator.clipboard.writeText(t); toast('Copied'); }
      catch (e) { $('#exptext').select(); toast('Select and copy manually'); }
      return;
    }
    case 'csv': {
      const rows = [['start', 'end', 'target', 'common name', 'type', 'size_arcmin', 'frame_fill_pct', 'peak_alt_deg', 'moon_sep_deg', 'score']];
      for (const b of U.sched.blocks) {
        const o = byName(b.name), c = b.c;
        rows.push([fmtTime(b.s, st.tz), fmtTime(b.e, st.tz), b.name, o.c, P.TYPES[o.t], o.mj,
          c ? Math.round(c.fr.fill * 100) : '', c ? Math.round(c.w.maxAlt) : '', c ? Math.round(c.msep) : '', c ? Math.round(c.total) : '']);
      }
      download('session-' + U.date + '.csv', rows.map(r => r.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
      return;
    }
    case 'ics': {
      const z = t => new Date(t).toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
      let s = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//night planner//EN\r\n';
      for (const b of U.sched.blocks) {
        const o = byName(b.name);
        s += `BEGIN:VEVENT\r\nUID:${b.name.replace(/\s/g, '')}-${b.s}@nightplan\r\nDTSTAMP:${z(Date.now())}\r\n` +
          `DTSTART:${z(b.s)}\r\nDTEND:${z(b.e)}\r\nSUMMARY:${b.name}${o.c ? ' (' + o.c + ')' : ''}\r\n` +
          `DESCRIPTION:${(b.c ? whyText(b.c, b) : '').replace(/[,;]/g, ' ')}\r\nEND:VEVENT\r\n`;
      }
      download('session-' + U.date + '.ics', s + 'END:VCALENDAR\r\n', 'text/calendar');
      return;
    }

    /* ---- my images ---- */
    case 'gview': U.gview = k; render(); return;
    case 'gpick': U.pq = ''; pickObjectSheet(); return;
    case 'pq': {
      if (ev && ev.type !== 'input') return;         /* only while actually typing */
      if (U.pq === el.value) return;
      U.pq = el.value; pickObjectSheet(); return;
    }
    case 'shot': closeSheet(); shotSheet(el.dataset.i); return;
    case 'shotfile': {
      const files = Array.from(el.files || []); if (!files.length) return;
      if (!n) { toast('Pick an object first'); return; }
      working(true);
      let added = 0; const trouble = [];
      for (const f of files) {
        try { await IMG.add(n, f); added++; }
        catch (e) { trouble.push(msgOf(e)); }
      }
      el.value = '';
      if (added && !S.imaged[n]) {
        S.imaged[n] = { date: IMG.cover(n).date };
        S.save();
      }
      working(false); closeSheet();
      if (added) { U.gview = 'photos'; if (U.view !== 'gallery' && U.view !== 'targets') U.view = 'gallery'; }
      if (S.st.hideImaged && added) await recompute(true); else render();
      if (added) toast(added + (added > 1 ? ' frames added to ' : ' frame added to ') + n);
      if (trouble.length) toast(trouble[0]);
      return;
    }
    case 'cmpfade': {
      const im = document.querySelector('#cmpmine');
      if (im) im.style.opacity = (+el.value / 100).toFixed(2);
      return;
    }
    case 'shotdate': await IMG.patch(el.dataset.i, { date: el.value }); render(); return;
    case 'shotcap': await IMG.patch(el.dataset.i, { caption: el.value }); return;
    case 'shotcover': await IMG.setCover(el.dataset.i); shotSheet(el.dataset.i); toast('Cover set'); return;
    case 'shotdl': {
      const m = IMG.meta(el.dataset.i); if (!m) return;
      const b = await IMG.blob(el.dataset.i); if (!b) { toast('That frame is missing'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = m.fname || (m.obj.replace(/\s+/g, '') + '-' + (m.date || '') + '.jpg');
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 20000);
      return;
    }
    case 'shotdel': {
      const m = IMG.meta(el.dataset.i); if (!m) return;
      if (!confirm('Delete this frame of ' + m.obj + '? It cannot be recovered.')) return;
      await IMG.del(el.dataset.i); closeSheet(); render(); toast('Frame deleted');
      return;
    }
    case 'imgdate': {
      if (S.imaged[n]) { S.imaged[n].date = el.value; S.save(); }
      return;
    }

    /* ---- settings ---- */
    case 'set': {
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if (NUMK.has(k)) v = v === '' ? 0 : +v;
      else if (BOOLK.has(k)) v = el.type === 'checkbox' ? el.checked : (v === '1' || v === true);
      else if (k === 'magLimit') v = v === '' ? null : +v;
      st[k] = v; S.save();
      if (k === 'lat' || k === 'lon') later(() => { WX.load(st.lat, st.lon, true); recompute(); }, 700);
      else later(() => recompute(true), k === 'tz' || k === 'place' ? 600 : 260);
      if (['rig', 'tiles', 'twilight', 'narrowband'].includes(k)) { clearTimeout(reTimer); await recompute(true); }
      return;
    }
    case 'setrig': st.rigCustom[k] = +el.value; S.save(); later(() => recompute(true)); return;
    case 'clamp': {
      const v = el.value;
      const key = k === 'start' ? 'startClampMin' : 'endClampMin';
      st[key] = v ? (((+v.split(':')[0] * 60 + +v.split(':')[1]) - 720 + 1440) % 1440) : null;
      S.save(); await recompute(); return;
    }
    case 'cat': {
      st.cats = st.cats.includes(k) ? st.cats.filter(x => x !== k) : st.cats.concat([k]);
      S.save(); await recompute(true); return;
    }
    case 'type': st.types[k] = !st.types[k]; S.save(); await recompute(true); return;
    case 'pref': st.typePref[k] = +el.value / 10; S.save(); later(() => recompute(true)); return;
    case 'weight': st.weights[k] = +el.value; S.save(); later(() => recompute(true)); return;
    case 'resetweights': st.weights = { ...DEFAULTS.weights }; S.save(); await recompute(true); return;
    case 'geo': {
      st.confirmed = true;
      if (!navigator.geolocation) { toast('This device will not share a location'); return; }
      toast('Asking for your location…');
      navigator.geolocation.getCurrentPosition(async p => {
        st.lat = +p.coords.latitude.toFixed(4); st.lon = +p.coords.longitude.toFixed(4);
        st.tz = Intl.DateTimeFormat().resolvedOptions().timeZone; S.save();
        await WX.load(st.lat, st.lon, true); await recompute();
        toast('Location set');
      }, e => toast('Location refused: ' + e.message), { timeout: 12000 });
      return;
    }
    case 'red': {
      document.body.classList.toggle('red');
      localStorage.setItem('nightplan.red', document.body.classList.contains('red') ? '1' : '');
      render(); return;
    }
    case 'backup':
      download('nightplan-backup.json', JSON.stringify({
        st: S.st, imaged: S.imaged, banned: S.banned, notes: S.notes, done: S.done,
        horizons: S.horizons, sizeOvr: S.sizeOvr, popOvr: S.popOvr
      }, null, 1), 'application/json');
      return;
    case 'backupimg': {
      if (!IMG.count) { toast('No photos stored yet'); return; }
      working(true);
      const shots = [];
      try {
        for (const o of IMG.objects()) for (const m of IMG.for(o)) {
          const b = await IMG.blob(m.id); if (!b) continue;
          const data = await new Promise((res, rej) => {
            const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]);
            r.onerror = () => rej(r.error); r.readAsDataURL(b);
          });
          shots.push({ ...m, type: b.type || 'image/jpeg', data });
        }
      } catch (e) { working(false); toast('Could not read the photos: ' + msgOf(e)); return; }
      working(false);
      download('nightplan-full-backup.json', JSON.stringify({
        st: S.st, imaged: S.imaged, banned: S.banned, notes: S.notes, done: S.done,
        horizons: S.horizons, sizeOvr: S.sizeOvr, popOvr: S.popOvr, shots
      }), 'application/json');
      toast(shots.length + ' frames included');
      return;
    }
    case 'restore': {
      const f = el.files[0]; if (!f) return;
      try {
        const j = JSON.parse(await f.text());
        deepMerge(S.st, j.st || {});
        Object.assign(S.imaged, j.imaged || {}); Object.assign(S.banned, j.banned || {});
        Object.assign(S.done, j.done || {});
        if (Array.isArray(j.shots) && j.shots.length) {
          let back = 0;
          for (const sh of j.shots) {
            try {
              const bin = atob(sh.data); const u8 = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
              const file = new File([u8], sh.fname || (sh.obj + '.jpg'), { type: sh.type || 'image/jpeg' });
              if (!IMG.for(sh.obj).some(m => m.id === sh.id)) { await IMG.add(sh.obj, file, sh.date); back++; }
            } catch (e) { }
          }
          if (back) toast(back + ' frames restored');
        }
        Object.assign(S.notes, j.notes || {}); Object.assign(S.horizons, j.horizons || {});
        Object.assign(S.sizeOvr, j.sizeOvr || {}); Object.assign(S.popOvr, j.popOvr || {});
        S.save(); await recompute(); toast('Restored');
      } catch (e) { toast('That file could not be read'); }
      return;
    }
    case 'note': S.notes[n] = el.value; S.save(); return;
    case 'ovsize': {
      const o = byName(n), cur = S.sizeOvr[n] || [o.mj, o.mi];
      cur[+k] = +el.value; S.sizeOvr[n] = cur; S.save(); later(() => recompute(true)); return;
    }
    case 'ovpop': S.popOvr[n] = +el.value; S.save(); later(() => recompute(true)); return;

    /* ---- targets ---- */
    case 'search': U.tq = el.value; U.tlimit = 60; U.focusSearch = true; render(); return;
    case 'tsort': U.tsort = k; U.tlimit = 60; render(); return;
    case 'tmore': U.tlimit += 120; render(); return;

    /* ---- horizon ---- */
    case 'usehz':
      st.useHorizon = el.type === 'checkbox' ? el.checked : !st.useHorizon;
      if (st.useHorizon && !S.horizon()) { toast('Save a horizon first'); st.useHorizon = false; }
      S.save(); await recompute(true); return;
    case 'pickhz': st.horizonId = el.value || null; S.save(); await recompute(true); return;
    case 'hzfile': {
      const f = el.files[0]; if (!f) return;
      toast('Reading the photo…');
      await HZ.loadFile(f);
      U.hzTool = 'sky'; U.hzThresh = U.hzThresh ?? 0.18; U.hzBrush = U.hzBrush ?? 0.05;
      HZ.autoTrace(U.hzThresh); HZ.autoCalibrate(U.hzVfov || 55); render(); return;
    }
    case 'hrzfile': {
      const f = el.files[0]; if (!f) return;
      const prof = HZ.parseHrz(await f.text());
      if (!prof) { toast('No azimuth and altitude pairs found in that file'); return; }
      const id = 'h' + Date.now();
      S.horizons[id] = { name: f.name.replace(/\.[^.]+$/, ''), prof };
      st.horizonId = id; st.useHorizon = true; S.save(); await recompute(true);
      toast('Horizon imported'); return;
    }
    case 'hztool': U.hzTool = k; render(); return;
    case 'hzthresh': U.hzThresh = +el.value / 100; HZ.autoTrace(U.hzThresh); hzRefresh(); return;
    case 'hzbrush': U.hzBrush = +el.value / 100; return;
    case 'hzcal': {
      HZ.cal[k] = k === 'flip' ? el.value === '1' : +el.value;
      hzRefresh(); return;
    }
    case 'hzauto': HZ.autoTrace(U.hzThresh ?? 0.18); hzRefresh(); return;
    case 'hzrecal': HZ.autoTrace(U.hzThresh ?? 0.18); HZ.autoCalibrate(U.hzVfov || 55); hzRefresh(); return;
    case 'hzvfov': U.hzVfov = +el.value; HZ.autoCalibrate(U.hzVfov); hzRefresh(); return;
    case 'hzflat': HZ.setFlat(0); hzRefresh(); return;
    case 'hzname': U.hzName = el.value; return;
    case 'hzsave': {
      const nm = (U.hzName || '').trim() || 'Horizon ' + (Object.keys(S.horizons).length + 1);
      const id = 'h' + Date.now();
      S.horizons[id] = { name: nm, prof: HZ.profile() };
      st.horizonId = id; st.useHorizon = true; S.save();
      HZ.reset(); U.hzName = ''; await recompute(true);
      toast('"' + nm + '" saved and switched on'); return;
    }
    case 'hzexport': download('horizon.hrz', HZ.toHrz(S.horizon())); return;
    case 'hzdelete': {
      delete S.horizons[st.horizonId]; st.horizonId = null; st.useHorizon = false;
      S.save(); await recompute(true); return;
    }
    case 'manual': {
      U.manual = U.manual || new Array(16).fill(0);
      U.manual[i] = +el.value; return;
    }
    case 'manualname': U.manualName = el.value; return;
    case 'manualsave': {
      const m = U.manual || new Array(16).fill(0);
      const prof = new Array(360);
      for (let az = 0; az < 360; az++) {
        const f = az / 22.5, a = Math.floor(f) % 16, b = (a + 1) % 16, t = f - Math.floor(f);
        prof[az] = Math.round((m[a] * (1 - t) + m[b] * t) * 10) / 10;
      }
      const id = 'h' + Date.now();
      S.horizons[id] = { name: (U.manualName || '').trim() || 'Manual horizon', prof };
      st.horizonId = id; st.useHorizon = true; S.save(); await recompute(true);
      toast('Horizon saved'); return;
    }
  }
}

/* ---------------- wiring ---------------- */
function findAct(e) {
  let el = e.target;
  while (el && el !== document.body) {
    if (el.dataset && el.dataset.act) return el;
    el = el.parentElement;
  }
  return null;
}
document.addEventListener('click', e => {
  const el = findAct(e);
  if (!el) return;
  const tag = el.tagName;
  if (tag === 'INPUT' && (el.type === 'text' || el.type === 'number' || el.type === 'time' || el.type === 'range' || el.type === 'file')) return;
  if (tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'A') return;
  e.preventDefault();
  act(el.dataset.act, el, e);
});
document.addEventListener('change', e => {
  const el = findAct(e); if (!el) return;
  /* text and number fields are handled on input; a change firing as the field is
     torn down would otherwise re-run whatever that field triggers */
  if (el.tagName === 'SELECT' || el.type === 'file' || el.type === 'checkbox' || el.type === 'time' || el.type === 'date') act(el.dataset.act, el, e);
});
document.addEventListener('input', e => {
  const el = findAct(e); if (!el) return;
  if (el.type === 'range') HAP.tick();
  if (el.type === 'range' || el.type === 'number' || el.type === 'text' || el.tagName === 'TEXTAREA') act(el.dataset.act, el, e);
});
/* a slider being dragged holds off the re-render until the finger lifts */
document.addEventListener('pointerdown', e => {
  if (e.target && e.target.type === 'range') U.drag = true;
}, true);
['pointerup', 'pointercancel', 'touchend'].forEach(t => document.addEventListener(t, () => {
  if (!U.drag) return;
  U.drag = false;
  if (U.pendingRender) { U.pendingRender = false; render(); }
}, true));
window.addEventListener('resize', () => { if (!U.busy) { afterRender(); paintRows(true); } });
window.addEventListener('scroll', onScrollTargets, { passive: true });

/* ---------- scrubbing the charts ---------- */
function scrubAlt(e) {
  const c = e.target.closest && e.target.closest('canvas[data-alt]');
  if (!c) return false;
  const r = c.getBoundingClientRect();
  drawAltPlot(c, c.dataset.alt, (e.clientX - r.left) / r.width);
  return true;
}
function scrubWx(e) {
  const box = e.target.closest && e.target.closest('.wx');
  if (!box || !U.wxHours) return false;
  const r = box.getBoundingClientRect();
  const i = Math.max(0, Math.min(U.wxHours.length - 1,
    Math.floor((e.clientX - r.left) / r.width * U.wxHours.length)));
  const x = U.wxHours[i], out = $('#wxread');
  if (out) {
    const spread = (x.temp != null && x.dew != null) ? Math.round((x.temp - x.dew) * 10) / 10 : null;
    out.textContent = fmtTime(x.t, S.st.tz) + ' · ' + Math.round(x.c) + '% cloud'
      + (x.temp != null ? ' · ' + Math.round(x.temp) + '°C' : '')
      + (spread != null ? ', ' + spread + '° from dew point' : '')
      + (x.wind != null ? ' · wind ' + Math.round(x.wind) + ' km/h' : '')
      + (x.rain > 5 ? ' · rain ' + Math.round(x.rain) + '%' : '');
  }
  return true;
}
let scrubbing = false;
document.addEventListener('pointerdown', e => {
  if (e.target.closest && (e.target.closest('canvas[data-alt]') || e.target.closest('.wx'))) {
    scrubbing = true; scrubAlt(e); scrubWx(e);
  }
}, { passive: true });
document.addEventListener('pointermove', e => {
  if (!scrubbing && e.pointerType === 'touch') return;
  if (scrubbing || e.pointerType === 'mouse') { scrubAlt(e); scrubWx(e); }
}, { passive: true });
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => {
  if (!scrubbing) return;
  scrubbing = false;
  /* leave the numbers on screen, but drop the crosshair */
  document.querySelectorAll('canvas[data-alt]').forEach(c => drawAltPlot(c, c.dataset.alt));
}, { passive: true }));
/* remember whether the timing card was left open */
document.addEventListener('toggle', e => {
  if (e.target && e.target.id === 'timingcard') U.timingOpen = e.target.open;
}, true);

/* ---------------- init ---------------- */
(async function init() {
  S.load();
  if (localStorage.getItem('nightplan.red')) document.body.classList.add('red');
  U.date = todayStr();
  U.hzTool = 'sky'; U.hzThresh = 0.18; U.hzBrush = 0.05;
  document.querySelectorAll('nav.tabs button').forEach(b => b.dataset.act = 'tab');
  initSwipe(); initBack(); initUpdates();
  await IMG.load();
  await recompute();
  WX.load(S.st.lat, S.st.lon).then(() => render());
})();

</script>
